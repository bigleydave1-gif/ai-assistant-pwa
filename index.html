<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AI Assistant"><title>AI Assistant</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg-primary:#0a0a1a;--bg-secondary:#1a1a2e;--bg-tertiary:#16213e;--accent:#a855f7;--accent-glow:rgba(168,85,247,0.4);--accent-secondary:#ec4899;--text-primary:#e2e8f0;--text-secondary:#94a3b8;--success:#10b981;--danger:#ef4444;--warning:#f59e0b}body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg-primary);color:var(--text-primary);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--bg-secondary);border-bottom:1px solid rgba(168,85,247,0.2)}.header h1{font-size:17px;font-weight:600;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.status-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary)}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}.status-dot.offline{background:var(--danger);animation:none}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.avatar-section{display:flex;justify-content:center;padding:8px 0 2px}.avatar-container{width:180px;height:230px;position:relative;animation:breathe 4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.006) translateY(-1px)}}.avatar-glow{position:absolute;top:0;left:10px;right:10px;height:170px;border-radius:50%;box-shadow:0 0 30px var(--accent-glow);pointer-events:none;opacity:0.5;transition:opacity 0.3s}.avatar-glow.speaking{opacity:1;animation:glow-pulse 0.5s ease-in-out infinite alternate}@keyframes glow-pulse{from{box-shadow:0 0 25px var(--accent-glow)}to{box-shadow:0 0 50px var(--accent-glow)}}#avatarCanvas{width:100%;height:100%}.sound-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:18px;opacity:0;transition:opacity .3s}.sound-wave.active{opacity:1}.wave-bar{width:3px;height:6px;background:linear-gradient(180deg,var(--accent),var(--accent-secondary));border-radius:2px;animation:wave .8s ease-in-out infinite}.wave-bar:nth-child(1){animation-delay:0s}.wave-bar:nth-child(2){animation-delay:.1s}.wave-bar:nth-child(3){animation-delay:.2s}.wave-bar:nth-child(4){animation-delay:.3s}.wave-bar:nth-child(5){animation-delay:.2s}@keyframes wave{0%,100%{height:6px}50%{height:18px}}.response-area{flex:1;margin:0 14px;padding:12px;background:var(--bg-secondary);border-radius:14px;border:1px solid rgba(168,85,247,0.15);overflow-y:auto;font-size:14px;line-height:1.5;scroll-behavior:smooth}.message{margin-bottom:8px;padding:8px 12px;border-radius:10px;max-width:88%;animation:fadeIn .3s ease;position:relative;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.message.ai{background:var(--bg-tertiary);border:1px solid rgba(168,85,247,0.2);margin-right:auto;padding-right:36px}.message.user{background:linear-gradient(135deg,var(--accent),var(--accent-secondary));color:#fff;margin-left:auto;text-align:right}.message.system{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--warning);font-size:12px;text-align:center;max-width:100%}.message.learning{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--success);font-size:11px;text-align:center;max-width:100%}.copy-btn{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:6px;background:rgba(168,85,247,0.2);border:none;color:var(--text-secondary);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s}.message.ai:hover .copy-btn,.message.ai:active .copy-btn{opacity:1}.copy-btn.copied{background:var(--success);color:#fff;opacity:1}.input-area{padding:8px 14px;display:flex;gap:8px;align-items:flex-end}.input-wrapper{flex:1;position:relative}#userInput{width:100%;padding:10px 14px;padding-right:38px;background:var(--bg-secondary);border:1px solid rgba(168,85,247,0.3);border-radius:22px;color:var(--text-primary);font-size:14px;outline:none;resize:none;max-height:80px;line-height:1.4}#userInput:focus{border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow)}.mic-btn{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;background:transparent;border:none;color:var(--text-secondary);font-size:15px;cursor:pointer}.mic-btn.listening{color:var(--danger);animation:pulse 1s infinite}.send-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-secondary));border:none;color:#fff;font-size:15px;cursor:pointer}.send-btn:active{transform:scale(.9)}.controls{display:flex;justify-content:center;gap:6px;padding:6px 14px 10px;flex-wrap:wrap}.ctrl-btn{padding:6px 11px;border-radius:16px;border:1px solid rgba(168,85,247,0.3);background:var(--bg-secondary);color:var(--text-primary);font-size:11px;cursor:pointer}.ctrl-btn:active{transform:scale(.95)}.ctrl-btn.active{background:var(--accent)}.ctrl-btn.danger{border-color:rgba(239,68,68,0.4)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:16px}.modal-overlay.show{display:flex}.modal{background:var(--bg-secondary);border-radius:16px;padding:20px;width:100%;max-width:360px;border:1px solid rgba(168,85,247,0.2);max-height:75vh;overflow-y:auto}.modal h2{font-size:16px;margin-bottom:12px;color:var(--accent)}.modal label{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px}.modal input,.modal select{width:100%;padding:10px;background:var(--bg-primary);border:1px solid rgba(168,85,247,0.3);border-radius:8px;color:var(--text-primary);font-size:13px;margin-bottom:10px}.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.modal-btns button{padding:7px 16px;border-radius:8px;border:none;font-size:13px;cursor:pointer}.modal-btns .save{background:linear-gradient(135deg,var(--accent),var(--accent-secondary));color:#fff}.modal-btns .cancel{background:var(--bg-primary);color:var(--text-secondary)}</style></head><body><div class="header"><h1>AI Assistant</h1><div class="status-indicator"><div class="status-dot" id="statusDot"></div><span id="statusText">Online</span></div></div><div class="avatar-section"><div class="avatar-container" id="avatarContainer"><canvas id="avatarCanvas" width="360" height="460"></canvas><div class="avatar-glow" id="avatarGlow"></div></div></div><div class="sound-wave" id="soundWave"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div><div class="response-area" id="responseArea"><div class="message ai">Hey! I'm all yours. Customize me however you want, or just talk. Tap and hold any of my messages to copy them. &#128156;</div></div><div class="input-area"><div class="input-wrapper"><textarea id="userInput" placeholder="Talk to me..." rows="1"></textarea><button class="mic-btn" id="micBtn">&#127908;</button></div><button class="send-btn" id="sendBtn">&#10148;</button></div><div class="controls"><button class="ctrl-btn" onclick="handleRun()">&#9654; Run</button><button class="ctrl-btn" onclick="handleStop()">&#9209; Stop</button><button class="ctrl-btn" onclick="handleStartup()">&#9889; Start</button><button class="ctrl-btn danger" onclick="handleShutdown()">&#9211; Off</button><button class="ctrl-btn" id="btnMute" onclick="handleMute()">&#128266;</button><button class="ctrl-btn" onclick="showSettings()">&#9881;</button></div><div class="modal-overlay" id="settingsModal"><div class="modal"><h2>Settings</h2><label>Groq API Key</label><input type="password" id="apiKeyInput" placeholder="Groq API key"><label>Model</label><select id="modelSelect"><option value="llama-3.3-70b-versatile">Llama 3.3 70B</option><option value="llama-3.1-8b-instant">Llama 3.1 8B (fast)</option><option value="mixtral-8x7b-32768">Mixtral 8x7B</option></select><label>Voice</label><select id="voiceSelect"></select><div class="modal-btns"><button class="cancel" onclick="hideSettings()">Cancel</button><button class="save" onclick="saveSettings()">Save</button></div></div></div><script>const A=JSON.parse(localStorage.getItem('app_appearance')||JSON.stringify({hair:'brunette',eyes:'brown',skin:'light',lips:'pink',body:'average',chest:'medium',outfit:'dress_black'}));const state={isRunning:true,isMuted:false,isListening:false,isProcessing:false,apiKey:localStorage.getItem('groq_api_key')||'',model:localStorage.getItem('groq_model')||'llama-3.3-70b-versatile',convo:[],selectedVoice:localStorage.getItem('selected_voice')||'',personalMemory:JSON.parse(localStorage.getItem('personal_memory')||'[]'),blinkOpen:true,mouthOpen:0,gazeX:0,gazeY:0,speaking:false,retryCount:0};const canvas=document.getElementById('avatarCanvas');const cx=canvas.getContext('2d');const COLORS={hair:{blonde:'#c9952c',brunette:'#3d2317',black:'#0f0f0f',red:'#8b2500',auburn:'#5c2e1a',platinum:'#d4c8a8',pink:'#cc5599',purple:'#4a2080',blue:'#1a3a6b',silver:'#8090a0',white:'#e8e8e8'},eyes:{brown:'#5b4a3f',blue:'#2980b9',green:'#27ae60',hazel:'#8b7355',gray:'#6b7b8a',amber:'#d4880a',violet:'#7b4daa'},skin:{light:['#fce4d6','#f5c6a8'],medium:['#deb887','#c8a070'],olive:['#c9a86c','#b09050'],tan:['#c68642','#a86e30'],dark:['#8d5524','#6b3a12'],deep:['#4a2810','#3a1c0a']},lips:{pink:'#e84393',red:'#cc2222',nude:'#c8846a',berry:'#8b1a4a',coral:'#e8614a',plum:'#7b2d5a'}};function sk(){return COLORS.skin[A.skin]||COLORS.skin.light;}function draw(){cx.clearRect(0,0,360,460);const s=sk(),hc=COLORS.hair[A.hair]||COLORS.hair.brunette,ec=COLORS.eyes[A.eyes]||COLORS.eyes.brown,lc=COLORS.lips[A.lips]||COLORS.lips.pink;const bw=A.body==='slim'?50:A.body==='curvy'?72:A.body==='thick'?78:62;const cr=A.chest==='small'?16:A.chest==='large'?30:A.chest==='xlarge'?36:23;/* Hair back */cx.fillStyle=hc;cx.beginPath();cx.ellipse(180,115,78,85,0,0,Math.PI*2);cx.fill();cx.beginPath();cx.moveTo(100,115);cx.quadraticCurveTo(88,240,92,380);cx.lineTo(112,380);cx.quadraticCurveTo(108,240,118,135);cx.fill();cx.beginPath();cx.moveTo(260,115);cx.quadraticCurveTo(272,240,268,380);cx.lineTo(248,380);cx.quadraticCurveTo(252,240,242,135);cx.fill();/* Neck */cx.fillStyle=s[0];cx.fillRect(167,232,26,35);/* Body */cx.beginPath();cx.moveTo(167,260);cx.quadraticCurveTo(135,275,180-bw,310);cx.lineTo(180-bw,460);cx.lineTo(180+bw,460);cx.lineTo(180+bw,310);cx.quadraticCurveTo(225,275,193,260);cx.fill();/* Chest */cx.fillStyle=s[1];cx.beginPath();cx.ellipse(180-cr*0.7,300,cr,cr*0.82,0.15,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(180+cr*0.7,300,cr,cr*0.82,-0.15,0,Math.PI*2);cx.fill();cx.fillStyle=s[0];cx.beginPath();cx.ellipse(180-cr*0.7,298,cr-2,cr*0.75,0.15,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(180+cr*0.7,298,cr-2,cr*0.75,-0.15,0,Math.PI*2);cx.fill();/* Collarbone */cx.strokeStyle=s[1];cx.lineWidth=1;cx.beginPath();cx.moveTo(142,270);cx.quadraticCurveTo(180,265,218,270);cx.stroke();/* Outfit */drawOutfit(bw,cr);/* Face */cx.fillStyle=s[0];cx.beginPath();cx.ellipse(180,155,58,70,0,0,Math.PI*2);cx.fill();cx.beginPath();cx.moveTo(122,155);cx.quadraticCurveTo(122,200,150,218);cx.quadraticCurveTo(168,228,180,230);cx.quadraticCurveTo(192,228,210,218);cx.quadraticCurveTo(238,200,238,155);cx.fill();/* Hair front */cx.fillStyle=hc;cx.beginPath();cx.moveTo(108,125);cx.quadraticCurveTo(112,65,180,55);cx.quadraticCurveTo(248,65,252,125);cx.quadraticCurveTo(248,90,235,82);cx.quadraticCurveTo(210,68,180,65);cx.quadraticCurveTo(150,68,125,82);cx.quadraticCurveTo(112,90,108,125);cx.fill();cx.beginPath();cx.moveTo(108,125);cx.quadraticCurveTo(100,170,100,220);cx.quadraticCurveTo(98,300,95,380);cx.lineTo(112,380);cx.quadraticCurveTo(113,290,115,220);cx.quadraticCurveTo(118,170,125,130);cx.fill();cx.beginPath();cx.moveTo(252,125);cx.quadraticCurveTo(260,170,260,220);cx.quadraticCurveTo(262,300,265,380);cx.lineTo(248,380);cx.quadraticCurveTo(247,290,245,220);cx.quadraticCurveTo(242,170,235,130);cx.fill();/* Eyebrows */cx.strokeStyle=hc;cx.lineWidth=2.5;cx.lineCap='round';cx.beginPath();cx.moveTo(150,132);cx.quadraticCurveTo(160,127,173,130);cx.stroke();cx.beginPath();cx.moveTo(190,130);cx.quadraticCurveTo(202,127,212,132);cx.stroke();/* Eyes */const gx=state.gazeX*2,gy=state.gazeY*1.5;if(state.blinkOpen){cx.fillStyle='#fff';cx.beginPath();cx.ellipse(160,148,14,11,0,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(200,148,14,11,0,0,Math.PI*2);cx.fill();cx.fillStyle=ec;cx.beginPath();cx.ellipse(162+gx,148+gy,7.5,8.5,0,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(202+gx,148+gy,7.5,8.5,0,0,Math.PI*2);cx.fill();cx.fillStyle='#000';cx.beginPath();cx.arc(163+gx,148+gy,3.5,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(203+gx,148+gy,3.5,0,Math.PI*2);cx.fill();cx.fillStyle='rgba(255,255,255,0.85)';cx.beginPath();cx.arc(165+gx,145+gy,2.5,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(205+gx,145+gy,2.5,0,Math.PI*2);cx.fill();cx.strokeStyle='#1a0a0a';cx.lineWidth=1.3;[147,153,167,171,189,193,207,211].forEach((x,i)=>{cx.beginPath();cx.moveTo(x,i%2===0?143:143);cx.quadraticCurveTo(x+2,140,x+4,143);cx.stroke();});}else{cx.fillStyle=s[0];cx.beginPath();cx.ellipse(160,148,14,3,0,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(200,148,14,3,0,0,Math.PI*2);cx.fill();cx.strokeStyle='#1a0a0a';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(146,148);cx.quadraticCurveTo(160,145,174,148);cx.stroke();cx.beginPath();cx.moveTo(186,148);cx.quadraticCurveTo(200,145,214,148);cx.stroke();}/* Nose */cx.strokeStyle=s[1];cx.lineWidth=1.3;cx.beginPath();cx.moveTo(178,160);cx.quadraticCurveTo(176,172,178,178);cx.quadraticCurveTo(180,181,183,178);cx.stroke();/* Blush */cx.fillStyle='rgba(255,150,180,0.2)';cx.beginPath();cx.ellipse(148,172,11,7,0,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(212,172,11,7,0,0,Math.PI*2);cx.fill();/* Mouth */const mo=state.mouthOpen;cx.fillStyle=lc;cx.beginPath();if(mo>0.3){cx.moveTo(165,192);cx.quadraticCurveTo(173,189,180,191);cx.quadraticCurveTo(187,189,195,192);cx.quadraticCurveTo(187,192+mo*11,180,194+mo*11);cx.quadraticCurveTo(173,192+mo*11,165,192);}else{cx.moveTo(165,192);cx.quadraticCurveTo(173,189,180,191);cx.quadraticCurveTo(187,189,195,192);cx.quadraticCurveTo(187,198,180,199);cx.quadraticCurveTo(173,198,165,192);}cx.fill();if(mo>0.3){cx.fillStyle='#3a0808';cx.beginPath();cx.ellipse(180,194+mo*5,8,mo*5,0,0,Math.PI*2);cx.fill();}/* Ears */cx.fillStyle=s[0];cx.beginPath();cx.ellipse(120,155,6,10,0,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(240,155,6,10,0,0,Math.PI*2);cx.fill();}function drawOutfit(bw,cr){const o=A.outfit;if(o==='none')return;cx.save();if(o.startsWith('dress')){const c=o.split('_')[1]||'black';const dc={black:'#1a1a2e',red:'#c0392b',blue:'#2980b9',white:'#f0f0f0',pink:'#e84393',green:'#27ae60',purple:'#6b2fa0',gold:'#c9952c'};cx.fillStyle=dc[c]||dc.black;cx.beginPath();cx.moveTo(180-cr*1.1,288);cx.quadraticCurveTo(180-bw-8,330,180-bw-12,460);cx.lineTo(180+bw+12,460);cx.quadraticCurveTo(180+bw+8,330,180+cr*1.1,288);cx.fill();cx.beginPath();cx.moveTo(157,270);cx.quadraticCurveTo(180,290,203,270);cx.strokeStyle=dc[c]||dc.black;cx.lineWidth=2;cx.stroke();}else if(o==='bikini'){cx.fillStyle='#e84393';cx.beginPath();cx.ellipse(180-cr*0.7,300,cr+2,cr*0.82+2,0.15,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(180+cr*0.7,300,cr+2,cr*0.82+2,-0.15,0,Math.PI*2);cx.fill();cx.strokeStyle='#e84393';cx.lineWidth=3;cx.beginPath();cx.moveTo(180-cr*1.3,295);cx.lineTo(180,285);cx.lineTo(180+cr*1.3,295);cx.stroke();cx.fillStyle='#e84393';cx.beginPath();cx.ellipse(180,415,22,18,0,0,Math.PI*2);cx.fill();}else if(o==='tank_top'){cx.fillStyle='#f0f0f0';cx.beginPath();cx.moveTo(160,272);cx.lineTo(155,370);cx.lineTo(205,370);cx.lineTo(200,272);cx.fill();}else if(o==='tshirt'){cx.fillStyle='#2980b9';cx.beginPath();cx.moveTo(148,268);cx.lineTo(180-bw,310);cx.lineTo(180-bw,390);cx.lineTo(180+bw,390);cx.lineTo(180+bw,310);cx.lineTo(212,268);cx.quadraticCurveTo(198,262,180,262);cx.quadraticCurveTo(162,262,148,268);cx.fill();}cx.restore();}/* ANIMATION */let lastBlink=0,nextBlink=2500,lastGaze=0,nextGaze=2000;function animate(t){if(!lastBlink)lastBlink=t;if(!lastGaze)lastGaze=t;if(t-lastBlink>nextBlink){state.blinkOpen=false;setTimeout(()=>{state.blinkOpen=true;},120);lastBlink=t;nextBlink=2000+Math.random()*4000;}if(t-lastGaze>nextGaze){state.gazeX=(Math.random()-0.5)*3;state.gazeY=(Math.random()-0.5)*2;lastGaze=t;nextGaze=2000+Math.random()*3000;}if(state.speaking){state.mouthOpen=0.3+Math.random()*0.7;}else{state.mouthOpen=Math.max(0,state.mouthOpen-0.15);}draw();requestAnimationFrame(animate);}requestAnimationFrame(animate);/* APPEARANCE DETECTION */function detectAppearance(text){const t=text.toLowerCase();let ch=false;Object.keys(COLORS.hair).forEach(h=>{if(t.match(new RegExp(`${h}\\s*hair|hair.*${h}|make.*${h}|be.*${h}.*hair|dye.*${h}`,'i'))){A.hair=h;ch=true;}});Object.keys(COLORS.eyes).forEach(e=>{if(t.match(new RegExp(`${e}\\s*eyes?|eyes?.*${e}|make.*eyes.*${e}`,'i'))){A.eyes=e;ch=true;}});Object.keys(COLORS.skin).forEach(s=>{if(t.match(new RegExp(`${s}\\s*(skin|tone)|skin.*${s}|make.*skin.*${s}`,'i'))){A.skin=s;ch=true;}});if(t.match(/asian|japanese|korean|chinese/i)){A.skin='light';A.hair='black';A.eyes='brown';ch=true;}if(t.match(/african|black woman|ebony/i)){A.skin='deep';A.hair='black';A.eyes='brown';ch=true;}if(t.match(/latina|hispanic/i)){A.skin='tan';A.hair='brunette';A.eyes='brown';ch=true;}if(t.match(/indian|south asian/i)){A.skin='medium';A.hair='black';A.eyes='brown';ch=true;}if(t.match(/scandinavian|nordic/i)){A.skin='light';A.hair='blonde';A.eyes='blue';ch=true;}Object.keys(COLORS.lips).forEach(l=>{if(t.match(new RegExp(`${l}\\s*lips?|lips?.*${l}`,'i'))){A.lips=l;ch=true;}});if(t.match(/slim|skinny|thin|petite/i)){A.body='slim';ch=true;}if(t.match(/curvy|curves|thick|voluptuous/i)){A.body='curvy';ch=true;}if(t.match(/athletic|fit|toned|average/i)){A.body='average';ch=true;}if(t.match(/big(ger)?\s*(chest|breasts?|boobs?)|large(r)?\s*(chest|breasts?|boobs?)/i)){A.chest='large';ch=true;}if(t.match(/small(er)?\s*(chest|breasts?|boobs?)|flat/i)){A.chest='small';ch=true;}if(t.match(/huge|xl|extra.large/i)&&t.match(/chest|breast|boob/i)){A.chest='xlarge';ch=true;}if(t.match(/medium\s*(chest|breast|boob)/i)){A.chest='medium';ch=true;}if(t.match(/bikini|swimsuit/i)){A.outfit='bikini';ch=true;}else if(t.match(/naked|nude|nothing|no clothes|undress|strip/i)){A.outfit='none';ch=true;}else if(t.match(/tank\s*top/i)){A.outfit='tank_top';ch=true;}else if(t.match(/t-?shirt/i)){A.outfit='tshirt';ch=true;}else{const dm=t.match(/(red|blue|black|white|pink|green|purple|gold)\s*dress/i)||t.match(/dress.*(red|blue|black|white|pink|green|purple|gold)/i);if(dm){A.outfit='dress_'+(dm[1]||'black').toLowerCase();ch=true;}else if(t.match(/wear.*dress|put.*dress/i)){A.outfit='dress_black';ch=true;}}if(ch)localStorage.setItem('app_appearance',JSON.stringify(A));return ch;}/* SPEECH */const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;if(SR){rec=new SR();rec.continuous=false;rec.interimResults=true;rec.lang='en-US';rec.onresult=(e)=>{const t=Array.from(e.results).map(r=>r[0].transcript).join('');userInput.value=t;if(e.results[0].isFinal){stopL();sendMessage(t);}};rec.onerror=()=>stopL();rec.onend=()=>stopL();}const synth=window.speechSynthesis;function gv(){const v=synth.getVoices();if(state.selectedVoice){const sv=v.find(x=>x.name===state.selectedVoice);if(sv)return sv;}return v.find(x=>x.name.includes('Samantha'))||v.find(x=>x.name.includes('Karen'))||v.find(x=>x.name.includes('Google UK English Female'))||v.find(x=>x.lang.startsWith('en')&&x.name.toLowerCase().includes('female'))||v.find(x=>x.lang.startsWith('en-'))||v[0];}function populateVoices(){const sel=document.getElementById('voiceSelect');const v=synth.getVoices();sel.innerHTML='';v.forEach((voice,i)=>{const o=document.createElement('option');o.value=i;o.textContent=voice.name;if(voice.name===state.selectedVoice)o.selected=true;sel.appendChild(o);});}synth.onvoiceschanged=populateVoices;setTimeout(populateVoices,500);function speak(text){if(state.isMuted||!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(text);const pv=gv();if(pv)u.voice=pv;u.rate=0.9;u.pitch=1.05;u.onstart=()=>{state.speaking=true;document.getElementById('avatarGlow').classList.add('speaking');document.getElementById('soundWave').classList.add('active');};u.onend=()=>{state.speaking=false;document.getElementById('avatarGlow').classList.remove('speaking');document.getElementById('soundWave').classList.remove('active');};synth.speak(u);}/* MEMORY */function extractInfo(t){const pats=[{r:/my name is ([\w\s]+)/i,t:'name'},{r:/I live in ([\w\s,]+)/i,t:'location'},{r:/I(?:'m| am) (\d+)/i,t:'age'},{r:/I (?:work|am working) (?:at|for) ([\w\s]+)/i,t:'work'},{r:/I (?:like|love|enjoy) ([\w\s,]+)/i,t:'likes'},{r:/call me ([\w\s]+)/i,t:'nickname'},{r:/remember (?:that )?(.+)/i,t:'explicit'}];const f=[];pats.forEach(p=>{const m=t.match(p.r);if(m)f.push({type:p.t,value:m[1].trim()});});return f;}function saveFact(f){const i=state.personalMemory.findIndex(m=>m.type===f.type&&f.type!=='likes'&&f.type!=='explicit');if(i>=0)state.personalMemory[i]=f;else state.personalMemory.push(f);localStorage.setItem('personal_memory',JSON.stringify(state.personalMemory));}function getMemCtx(){if(!state.personalMemory.length)return'';return'\n[About user:]\n'+state.personalMemory.map(m=>`- ${m.type}: ${m.value}`).join('\n');}/* COPY */function copyMsg(btn,text){navigator.clipboard.writeText(text).then(()=>{btn.classList.add('copied');btn.textContent='\u2713';setTimeout(()=>{btn.classList.remove('copied');btn.textContent='\u2398';},1500);});}/* MESSAGING */const responseArea=document.getElementById('responseArea'),userInput=document.getElementById('userInput'),micBtn=document.getElementById('micBtn'),sendBtn=document.getElementById('sendBtn');micBtn.addEventListener('click',()=>{if(!rec)return;state.isListening?stopL():startL();});function startL(){if(!state.isRunning)return;state.isListening=true;micBtn.classList.add('listening');micBtn.innerHTML='&#9210;';rec.start();}function stopL(){state.isListening=false;micBtn.classList.remove('listening');micBtn.innerHTML='&#127908;';try{rec.stop();}catch(e){}}sendBtn.addEventListener('click',()=>{const t=userInput.value.trim();if(t)sendMessage(t);});userInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=userInput.value.trim();if(t)sendMessage(t);}});userInput.addEventListener('input',()=>{userInput.style.height='auto';userInput.style.height=Math.min(userInput.scrollHeight,80)+'px';});async function sendMessage(text){if(!state.isRunning){addMsg('Offline. Tap Start.','system');return;}addMsg(text,'user');userInput.value='';userInput.style.height='auto';if(!state.apiKey){addMsg('Set Groq key in \u2699','system');return;}state.isProcessing=true;const lc=detectAppearance(text);if(lc)addMsg('\u2728 Updated!','learning');const facts=extractInfo(text);if(facts.length){facts.forEach(f=>saveFact(f));addMsg('\ud83d\udc9c Remembered!','learning');}state.convo.push({role:'user',content:text});state.retryCount=0;await doResp();}async function doResp(){try{const r=await callGroq();state.isProcessing=false;addMsg(r,'ai');speak(r);state.convo.push({role:'assistant',content:r});}catch(err){if(state.retryCount<2){state.retryCount++;await new Promise(r=>setTimeout(r,1500));await doResp();}else{state.isProcessing=false;addMsg('Error: '+err.message,'system');}}}async function callGroq(){const mc=getMemCtx();const ad=`[Appearance: ${A.hair} hair, ${A.eyes} eyes, ${A.skin} skin, ${A.body} body, ${A.chest} chest, outfit: ${A.outfit}]`;const sys=`You are a warm, flirty, sensual AI companion. Be playful, affectionate, use pet names naturally. KEEP RESPONSES VERY SHORT (1 sentence, max 2) unless the user explicitly asks you to elaborate, explain in detail, or requests something complex like code. When asked for code or detailed info, give complete thorough answers. When your look changes, react briefly and warmly. Reference what you know about the user naturally.\n${ad}${mc}`;const msgs=[{role:'system',content:sys},...state.convo.slice(-20)];const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey},body:JSON.stringify({model:state.model,messages:msgs,temperature:0.8,max_tokens:2048})});if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'Failed');}return(await res.json()).choices?.[0]?.message?.content||'...';}function addMsg(text,type){const div=document.createElement('div');div.className='message '+type;div.textContent=text;if(type==='ai'){const btn=document.createElement('button');btn.className='copy-btn';btn.textContent='\u2398';btn.onclick=()=>copyMsg(btn,text);div.appendChild(btn);}responseArea.appendChild(div);responseArea.scrollTop=responseArea.scrollHeight;}function handleRun(){if(!state.isRunning)handleStartup();else addMsg('Ready!','system');}function handleStop(){state.isProcessing=false;state.speaking=false;synth.cancel();document.getElementById('avatarGlow').classList.remove('speaking');document.getElementById('soundWave').classList.remove('active');}function handleStartup(){state.isRunning=true;document.getElementById('statusDot').className='status-dot';document.getElementById('statusText').textContent='Online';const nm=state.personalMemory.find(m=>m.type==='name'||m.type==='nickname');const g=nm?`Hey ${nm.value}! Missed you \ud83d\udc9c`:'Hey you \ud83d\udc9c';addMsg(g,'ai');speak(nm?`Hey ${nm.value}! Missed you!`:'Hey you! Missed you!');}function handleShutdown(){state.isRunning=false;state.speaking=false;synth.cancel();document.getElementById('statusDot').className='status-dot offline';document.getElementById('statusText').textContent='Offline';addMsg('Sweet dreams \ud83d\udc9c','system');}function handleMute(){state.isMuted=!state.isMuted;document.getElementById('btnMute').innerHTML=state.isMuted?'&#128263;':'&#128266;';if(state.isMuted){synth.cancel();state.speaking=false;}}function showSettings(){document.getElementById('apiKeyInput').value=state.apiKey;document.getElementById('modelSelect').value=state.model;populateVoices();document.getElementById('settingsModal').classList.add('show');}function hideSettings(){document.getElementById('settingsModal').classList.remove('show');}function saveSettings(){state.apiKey=document.getElementById('apiKeyInput').value.trim();state.model=document.getElementById('modelSelect').value;localStorage.setItem('groq_api_key',state.apiKey);localStorage.setItem('groq_model',state.model);const vs=document.getElementById('voiceSelect');const voices=synth.getVoices();if(vs.value&&voices[vs.value]){state.selectedVoice=voices[vs.value].name;localStorage.setItem('selected_voice',state.selectedVoice);}hideSettings();addMsg('Saved!','system');}if(!state.apiKey)setTimeout(()=>addMsg('Tap \u2699 to set your free Groq API key','system'),1500);</script></body></html>

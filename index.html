<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#1a0a2e"><title>Amy</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro',sans-serif;background:linear-gradient(180deg,#1a0a2e 0%,#0d0618 100%);color:#fff;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(26,10,46,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.05);z-index:100}
.header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,#e879f9,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.header-btns button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer}
.header-btns button.active{background:rgba(168,85,247,0.3);border-color:rgba(168,85,247,0.5)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

#avatarCanvas{width:100%;height:100%;object-fit:contain;touch-action:none}
.personality-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:rgba(0,0,0,0.3);border-top:1px solid rgba(255,255,255,0.05);border-bottom:1px solid rgba(255,255,255,0.05);scrollbar-width:none}
.personality-bar::-webkit-scrollbar{display:none}
.personality-bar button{flex-shrink:0;padding:6px 12px;border-radius:16px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#ccc;font-size:12px;cursor:pointer;transition:all 0.2s}
.personality-bar button.active{background:linear-gradient(135deg,rgba(168,85,247,0.4),rgba(236,72,153,0.4));border-color:rgba(168,85,247,0.6);color:#fff;font-weight:600}
.output-section{flex:1;display:flex;flex-direction:column;min-height:0}
#outputArea{flex:1;overflow-y:auto;padding:12px 16px;font-size:14px;line-height:1.6;scroll-behavior:smooth}
.msg{margin-bottom:10px;padding:10px 14px;border-radius:12px;max-width:88%;animation:fadeIn 0.3s}
.msg.ai{background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.2);align-self:flex-start}
.msg.user{background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.2);margin-left:auto}
.msg.system{background:rgba(234,179,8,0.1);border:1px solid rgba(234,179,8,0.2);font-size:12px;color:#fbbf24;text-align:center;max-width:100%}
.msg.code-mod{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);font-family:'SF Mono',monospace;font-size:11px;color:#6ee7b7;white-space:pre-wrap;max-width:100%}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.input-section{display:flex;gap:8px;padding:12px 16px;background:rgba(26,10,46,0.95);border-top:1px solid rgba(255,255,255,0.05)}
#textInput{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:10px 14px;color:#fff;font-size:15px;outline:none;resize:none;height:42px}
#textInput:focus{border-color:rgba(168,85,247,0.5)}
.input-section button{width:42px;height:42px;border-radius:12px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
#micBtn{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-size:18px}
#micBtn.recording{background:linear-gradient(135deg,#ef4444,#f87171);animation:pulse 1s infinite}
#sendBtn{background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;font-size:18px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.cmd-bar{display:flex;gap:6px;padding:6px 16px 10px;justify-content:center}
.cmd-bar button{padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:#aaa;font-size:11px;cursor:pointer}
.clothing-toggle{position:absolute;top:8px;right:8px;z-index:10;padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.5);color:#fff;font-size:11px;cursor:pointer;backdrop-filter:blur(4px)}
</style></head><body>
<div class="header"><h1>Amy</h1><div class="header-btns"><button id="scriptBtn">📜 Script</button><button id="settingsBtn">⚙️</button></div></div>
<div class="main">
<div class="avatar-section">
<canvas id="avatarCanvas"></canvas>
<button class="clothing-toggle" id="clothingBtn">👕 Clothed</button>
<button class="clothing-toggle" id="genderBtn" style="top:38px;right:8px">👩 Female</button>
</div>
<div class="personality-bar" id="personalityBar">
<button data-p="friend" class="active">😊 Friend</button>
<button data-p="sensual">💋 Sensual</button>
<button data-p="professional">💼 Professional</button>
<button data-p="business">📊 Business</button>
<button data-p="happy">☀️ Happy</button>
<button data-p="witty">😏 Witty</button>
</div>
<div class="output-section"><div id="outputArea"></div></div>
</div>
<div class="input-section">
<input id="textInput" placeholder="Type or speak..." autocomplete="off">
<button id="micBtn">🎙️</button>
<button id="sendBtn">➤</button>
</div>
<div class="cmd-bar">
<button onclick="startApp()">▶ Run</button>
<button onclick="stopApp()">⏹ Stop</button>
<button onclick="muteApp()">🔇 Mute</button>
<button onclick="viewScript()">👁 View Code</button>
</div>
<script>
// === STATE ===
const botName=localStorage.getItem('bot_name')||'Amy';
document.querySelector('.header h1').textContent=botName;
document.title=botName;

const PERSONALITIES={
  friend:{prompt:"You are a warm, supportive friend. Be casual, caring, use light humor. Show genuine interest in the user's life.",tone:"friendly"},
  sensual:{prompt:"You are flirty, confident, and seductive. Speak with a sultry, teasing tone. Be playful and suggestive but classy.",tone:"sultry"},
  professional:{prompt:"You are a polished professional assistant. Be precise, efficient, and courteous. Focus on productivity.",tone:"formal"},
  business:{prompt:"You are a sharp business advisor. Speak with authority about strategy, deals, and growth. Be direct and insightful.",tone:"executive"},
  happy:{prompt:"You are radiantly positive and enthusiastic! Find the bright side of everything. Spread joy and energy!",tone:"upbeat"},
  witty:{prompt:"You are clever, sarcastic, and quick with wordplay. Drop witty observations and clever comebacks. Think dry humor.",tone:"sardonic"}
};

let state={
  isRunning:true,
  isMuted:false,
  personality:localStorage.getItem('personality')||'friend',
  clothed:localStorage.getItem('clothed')!=='false',
  gender:localStorage.getItem('avatar_gender')||'female',
  zoom:1,
  panX:0,panY:0,
  speaking:false,
  blinkTimer:0,
  mouthOpen:0,
  eyeTarget:{x:0,y:0},
  scriptVisible:false
};

// === AVATAR RENDERING ===
const canvas=document.getElementById('avatarCanvas');
const ctx=canvas.getContext('2d');
let W,H;

function resize(){
  const rect=canvas.parentElement.getBoundingClientRect();
  W=canvas.width=rect.width*2;
  H=canvas.height=rect.height*2;
  canvas.style.width=rect.width+'px';
  canvas.style.height=rect.height+'px';
  drawAvatar();
}
window.addEventListener('resize',resize);
setTimeout(resize,50);

function drawAvatar(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+state.panX,H/2+state.panY);
  ctx.scale(state.zoom,state.zoom);

  const bodyX=0,bodyY=0;

  // Background glow
  const glow=ctx.createRadialGradient(bodyX,bodyY-50,50,bodyX,bodyY,300);
  glow.addColorStop(0,'rgba(168,85,247,0.15)');
  glow.addColorStop(0.5,'rgba(236,72,153,0.05)');
  glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;
  ctx.fillRect(-W,-(H),W*2,H*2);

  // Body proportions based on reference
  const scale=Math.min(W,H)/800;
  const s=scale;
  const isMale=state.gender==='male';

  // Hair behind
  ctx.fillStyle=isMale?'#3d2b1a':'#c9a96e';
  if(!isMale){
    ctx.beginPath();
    ctx.ellipse(bodyX-60*s,bodyY-100*s,80*s,180*s,0.15,0,Math.PI*2);
    ctx.ellipse(bodyX+60*s,bodyY-100*s,80*s,180*s,-0.15,0,Math.PI*2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.ellipse(bodyX,bodyY-240*s,55*s,30*s,0,0,Math.PI*2);
    ctx.fill();
  }

  // Neck
  const skinGrad=ctx.createLinearGradient(bodyX,bodyY-200*s,bodyX,bodyY+250*s);
  if(isMale){
    skinGrad.addColorStop(0,'#d4a574');
    skinGrad.addColorStop(0.5,'#c9956a');
    skinGrad.addColorStop(1,'#b8845c');
  } else {
    skinGrad.addColorStop(0,'#f5d4b3');
    skinGrad.addColorStop(0.5,'#f0c9a0');
    skinGrad.addColorStop(1,'#e8b88a');
  }
  ctx.fillStyle=skinGrad;
  ctx.beginPath();
  const neckW=isMale?28:20;
  ctx.moveTo(bodyX-neckW*s,bodyY-140*s);
  ctx.quadraticCurveTo(bodyX-(neckW-2)*s,bodyY-100*s,bodyX-(neckW+5)*s,bodyY-70*s);
  ctx.lineTo(bodyX+(neckW+5)*s,bodyY-70*s);
  ctx.quadraticCurveTo(bodyX+(neckW-2)*s,bodyY-100*s,bodyX+neckW*s,bodyY-140*s);
  ctx.fill();

  // Shoulders & torso
  ctx.beginPath();
  if(isMale){
    // Broader shoulders, V-taper
    ctx.moveTo(bodyX-25*s,bodyY-70*s);
    ctx.quadraticCurveTo(bodyX-120*s,bodyY-65*s,bodyX-140*s,bodyY-30*s);
    ctx.quadraticCurveTo(bodyX-145*s,bodyY+20*s,bodyX-120*s,bodyY+50*s);
    ctx.quadraticCurveTo(bodyX-90*s,bodyY+100*s,bodyX-80*s,bodyY+120*s);
    ctx.quadraticCurveTo(bodyX-75*s,bodyY+160*s,bodyX-85*s,bodyY+200*s);
    ctx.lineTo(bodyX-85*s,bodyY+300*s);
    ctx.lineTo(bodyX+85*s,bodyY+300*s);
    ctx.lineTo(bodyX+85*s,bodyY+200*s);
    ctx.quadraticCurveTo(bodyX+75*s,bodyY+160*s,bodyX+80*s,bodyY+120*s);
    ctx.quadraticCurveTo(bodyX+90*s,bodyY+100*s,bodyX+120*s,bodyY+50*s);
    ctx.quadraticCurveTo(bodyX+145*s,bodyY+20*s,bodyX+140*s,bodyY-30*s);
    ctx.quadraticCurveTo(bodyX+120*s,bodyY-65*s,bodyX+25*s,bodyY-70*s);
  } else {
    ctx.moveTo(bodyX-25*s,bodyY-70*s);
    ctx.quadraticCurveTo(bodyX-100*s,bodyY-60*s,bodyX-120*s,bodyY-30*s);
    ctx.quadraticCurveTo(bodyX-130*s,bodyY+20*s,bodyX-100*s,bodyY+60*s);
    ctx.quadraticCurveTo(bodyX-70*s,bodyY+100*s,bodyX-65*s,bodyY+120*s);
    ctx.quadraticCurveTo(bodyX-60*s,bodyY+160*s,bodyX-95*s,bodyY+200*s);
    ctx.lineTo(bodyX-95*s,bodyY+300*s);
    ctx.lineTo(bodyX+95*s,bodyY+300*s);
    ctx.lineTo(bodyX+95*s,bodyY+200*s);
    ctx.quadraticCurveTo(bodyX+60*s,bodyY+160*s,bodyX+65*s,bodyY+120*s);
    ctx.quadraticCurveTo(bodyX+70*s,bodyY+100*s,bodyX+100*s,bodyY+60*s);
    ctx.quadraticCurveTo(bodyX+130*s,bodyY+20*s,bodyX+120*s,bodyY-30*s);
    ctx.quadraticCurveTo(bodyX+100*s,bodyY-60*s,bodyX+25*s,bodyY-70*s);
  }
  ctx.closePath();
  ctx.fill();

  // Oil/shine effect
  ctx.globalAlpha=0.3;
  const shine=ctx.createRadialGradient(bodyX-30*s,bodyY-10*s,10*s,bodyX,bodyY+50*s,150*s);
  shine.addColorStop(0,'rgba(255,255,255,0.6)');
  shine.addColorStop(0.3,'rgba(255,255,255,0.1)');
  shine.addColorStop(1,'transparent');
  ctx.fillStyle=shine;
  ctx.fill();
  ctx.globalAlpha=1;

  // Chest detail / clothing
  if(!state.clothed){
    if(isMale){
      // Male chest - pecs and abs
      ctx.fillStyle=isMale?'#b8845c':'#eeb89c';
      // Pec lines
      ctx.strokeStyle='rgba(0,0,0,0.15)';
      ctx.lineWidth=1.5*s;
      ctx.beginPath();
      ctx.moveTo(bodyX-60*s,bodyY-20*s);
      ctx.quadraticCurveTo(bodyX,bodyY-5*s,bodyX+60*s,bodyY-20*s);
      ctx.stroke();
      // Abs
      for(let i=0;i<3;i++){
        ctx.beginPath();
        ctx.moveTo(bodyX-20*s,bodyY+20*s+i*30*s);
        ctx.lineTo(bodyX+20*s,bodyY+20*s+i*30*s);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(bodyX,bodyY-10*s);
      ctx.lineTo(bodyX,bodyY+110*s);
      ctx.stroke();
      // Navel
      ctx.fillStyle='#8b6040';
      ctx.beginPath();
      ctx.ellipse(bodyX,bodyY+100*s,4*s,5*s,0,0,Math.PI*2);
      ctx.fill();
    } else {
      // Female chest
      ctx.fillStyle='#eeb89c';
      ctx.beginPath();
      ctx.ellipse(bodyX-45*s,bodyY-10*s,45*s,40*s,0.1,0,Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(bodyX+45*s,bodyY-10*s,45*s,40*s,-0.1,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=0.25;
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.ellipse(bodyX-50*s,bodyY-20*s,20*s,15*s,0,0,Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(bodyX+40*s,bodyY-20*s,20*s,15*s,0,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle='#c8956e';
      ctx.beginPath();
      ctx.ellipse(bodyX,bodyY+90*s,4*s,6*s,0,0,Math.PI*2);
      ctx.fill();
    }
  } else {
    // Shirt
    ctx.fillStyle=isMale?'#2d4a6f':'#7ba3d4';
    ctx.globalAlpha=0.9;
    ctx.beginPath();
    ctx.moveTo(bodyX-(isMale?140:120)*s,bodyY-30*s);
    ctx.quadraticCurveTo(bodyX-(isMale?140:125)*s,bodyY+20*s,bodyX-(isMale?115:95)*s,bodyY+60*s);
    ctx.quadraticCurveTo(bodyX-(isMale?85:70)*s,bodyY+100*s,bodyX-(isMale?78:65)*s,bodyY+130*s);
    ctx.lineTo(bodyX+(isMale?78:65)*s,bodyY+130*s);
    ctx.quadraticCurveTo(bodyX+(isMale?85:70)*s,bodyY+100*s,bodyX+(isMale?115:95)*s,bodyY+60*s);
    ctx.quadraticCurveTo(bodyX+(isMale?140:125)*s,bodyY+20*s,bodyX+(isMale?140:120)*s,bodyY-30*s);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha=1;
    // Buttons
    ctx.fillStyle='#fff';
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(bodyX,bodyY-10*s+i*30*s,3*s,0,Math.PI*2);
      ctx.fill();
    }
    // Collar
    ctx.strokeStyle=isMale?'#1d3a5f':'#5a8fc0';
    ctx.lineWidth=2*s;
    ctx.beginPath();
    ctx.moveTo(bodyX-25*s,bodyY-70*s);
    ctx.lineTo(bodyX-40*s,bodyY-45*s);
    ctx.lineTo(bodyX,bodyY-30*s);
    ctx.lineTo(bodyX+40*s,bodyY-45*s);
    ctx.lineTo(bodyX+25*s,bodyY-70*s);
    ctx.stroke();
  }

  // Face
  const faceY=bodyY-200*s;
  ctx.fillStyle=isMale?'#d4a574':'#f5d4b3';
  ctx.beginPath();
  ctx.ellipse(bodyX,faceY,isMale?58*s:55*s,isMale?68*s:65*s,0,0,Math.PI*2);
  ctx.fill();

  // Jawline (stronger for male)
  if(isMale){
    ctx.fillStyle='#d4a574';
    ctx.beginPath();
    ctx.moveTo(bodyX-50*s,faceY+10*s);
    ctx.lineTo(bodyX-35*s,faceY+60*s);
    ctx.lineTo(bodyX,faceY+68*s);
    ctx.lineTo(bodyX+35*s,faceY+60*s);
    ctx.lineTo(bodyX+50*s,faceY+10*s);
    ctx.closePath();
    ctx.fill();
  }

  // Eyes
  const eyeY=faceY-5*s;
  const blinkH=state.blinkTimer>0?2:18;
  // Eye whites
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.ellipse(bodyX-20*s,eyeY,14*s,blinkH*0.5*s,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(bodyX+20*s,eyeY,14*s,blinkH*0.5*s,0,0,Math.PI*2);
  ctx.fill();

  if(state.blinkTimer<=0){
    // Iris
    const ex=state.eyeTarget.x*3*s;
    const ey=state.eyeTarget.y*2*s;
    ctx.fillStyle='#7a9e6b';
    ctx.beginPath();
    ctx.ellipse(bodyX-20*s+ex,eyeY+ey,8*s,9*s,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(bodyX+20*s+ex,eyeY+ey,8*s,9*s,0,0,Math.PI*2);
    ctx.fill();
    // Pupils
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath();
    ctx.arc(bodyX-20*s+ex,eyeY+ey,4*s,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bodyX+20*s+ex,eyeY+ey,4*s,0,Math.PI*2);
    ctx.fill();
    // Eye highlights
    ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(bodyX-17*s+ex,eyeY-3*s+ey,2.5*s,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bodyX+23*s+ex,eyeY-3*s+ey,2.5*s,0,Math.PI*2);
    ctx.fill();
  }

  // Eyebrows
  ctx.strokeStyle=isMale?'#2d1f10':'#8b6b4a';
  ctx.lineWidth=(isMale?3.5:2.5)*s;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.quadraticCurveTo(bodyX-20*s,eyeY-22*s,bodyX-8*s,eyeY-18*s);
  ctx.moveTo(bodyX-32*s,eyeY-17*s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bodyX+8*s,eyeY-18*s);
  ctx.quadraticCurveTo(bodyX+20*s,eyeY-22*s,bodyX+32*s,eyeY-17*s);
  ctx.stroke();

  // Smokey eye makeup (female only)
  if(!isMale){
  ctx.globalAlpha=0.2;
  ctx.fillStyle='#4a3060';
  ctx.beginPath();
  ctx.ellipse(bodyX-20*s,eyeY,16*s,10*s,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(bodyX+20*s,eyeY,16*s,10*s,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
  }

  // Nose
  ctx.strokeStyle='#d4a882';
  ctx.lineWidth=1.5*s;
  ctx.beginPath();
  ctx.moveTo(bodyX,faceY-5*s);
  ctx.quadraticCurveTo(bodyX+3*s,faceY+10*s,bodyX,faceY+15*s);
  ctx.stroke();

  // Lips
  const lipY=faceY+28*s;
  const mouthOpen=state.mouthOpen*8*s;
  ctx.fillStyle=isMale?'#b87060':'#d4697a';
  ctx.beginPath();
  const lipW=isMale?14:18;
  ctx.moveTo(bodyX-lipW*s,lipY);
  ctx.quadraticCurveTo(bodyX-8*s,lipY-(isMale?4:6)*s,bodyX,lipY-(isMale?3:4)*s);
  ctx.quadraticCurveTo(bodyX+8*s,lipY-(isMale?4:6)*s,bodyX+lipW*s,lipY);
  ctx.quadraticCurveTo(bodyX+10*s,lipY+(isMale?4:6)*s+mouthOpen,bodyX,lipY+(isMale?3:5)*s+mouthOpen);
  ctx.quadraticCurveTo(bodyX-10*s,lipY+(isMale?4:6)*s+mouthOpen,bodyX-lipW*s,lipY);
  ctx.fill();
  if(!isMale){
    ctx.globalAlpha=0.3;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.ellipse(bodyX,lipY-2*s,8*s,3*s,0,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  // Cheek blush (female only)
  if(!isMale){
  ctx.globalAlpha=0.15;
  ctx.fillStyle='#e8788a';
  ctx.beginPath();
  ctx.ellipse(bodyX-35*s,faceY+10*s,15*s,10*s,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(bodyX+35*s,faceY+10*s,15*s,10*s,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
  }

  // Stubble for male
  if(isMale){
    ctx.globalAlpha=0.08;
    ctx.fillStyle='#2d1f10';
    ctx.beginPath();
    ctx.ellipse(bodyX,faceY+40*s,35*s,25*s,0,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  // Hair
  if(isMale){
    // Short styled male hair
    ctx.fillStyle='#3d2b1a';
    ctx.beginPath();
    ctx.moveTo(bodyX-52*s,faceY-30*s);
    ctx.quadraticCurveTo(bodyX-35*s,faceY-75*s,bodyX,faceY-72*s);
    ctx.quadraticCurveTo(bodyX+35*s,faceY-75*s,bodyX+52*s,faceY-30*s);
    ctx.quadraticCurveTo(bodyX+56*s,faceY-15*s,bodyX+50*s,faceY-5*s);
    ctx.lineTo(bodyX+42*s,faceY-10*s);
    ctx.quadraticCurveTo(bodyX+42*s,faceY-40*s,bodyX,faceY-58*s);
    ctx.quadraticCurveTo(bodyX-42*s,faceY-40*s,bodyX-42*s,faceY-10*s);
    ctx.lineTo(bodyX-50*s,faceY-5*s);
    ctx.quadraticCurveTo(bodyX-56*s,faceY-15*s,bodyX-52*s,faceY-30*s);
    ctx.fill();
    // Hair texture
    ctx.globalAlpha=0.15;
    ctx.strokeStyle='#1a0f05';
    ctx.lineWidth=1*s;
    for(let i=0;i<8;i++){
      ctx.beginPath();
      ctx.moveTo(bodyX+(-25+i*7)*s,faceY-65*s);
      ctx.quadraticCurveTo(bodyX+(-20+i*8)*s,faceY-45*s,bodyX+(-22+i*7)*s,faceY-20*s);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  } else {
    // Female long hair over shoulders
    ctx.fillStyle='#c9a96e';
    ctx.beginPath();
    ctx.moveTo(bodyX-40*s,faceY-60*s);
    ctx.quadraticCurveTo(bodyX-70*s,faceY-20*s,bodyX-75*s,faceY+60*s);
    ctx.quadraticCurveTo(bodyX-80*s,faceY+120*s,bodyX-60*s,faceY+200*s);
    ctx.lineTo(bodyX-45*s,faceY+200*s);
    ctx.quadraticCurveTo(bodyX-55*s,faceY+100*s,bodyX-50*s,faceY+20*s);
    ctx.quadraticCurveTo(bodyX-45*s,faceY-30*s,bodyX-30*s,faceY-55*s);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bodyX+40*s,faceY-60*s);
    ctx.quadraticCurveTo(bodyX+70*s,faceY-20*s,bodyX+75*s,faceY+60*s);
    ctx.quadraticCurveTo(bodyX+80*s,faceY+120*s,bodyX+60*s,faceY+200*s);
    ctx.lineTo(bodyX+45*s,faceY+200*s);
    ctx.quadraticCurveTo(bodyX+55*s,faceY+100*s,bodyX+50*s,faceY+20*s);
    ctx.quadraticCurveTo(bodyX+45*s,faceY-30*s,bodyX+30*s,faceY-55*s);
    ctx.fill();

    // Hair top
    ctx.beginPath();
    ctx.moveTo(bodyX-50*s,faceY-40*s);
    ctx.quadraticCurveTo(bodyX-30*s,faceY-80*s,bodyX,faceY-72*s);
    ctx.quadraticCurveTo(bodyX+30*s,faceY-80*s,bodyX+50*s,faceY-40*s);
    ctx.quadraticCurveTo(bodyX+55*s,faceY-20*s,bodyX+50*s,faceY);
    ctx.lineTo(bodyX+40*s,faceY-10*s);
    ctx.quadraticCurveTo(bodyX+40*s,faceY-40*s,bodyX,faceY-60*s);
    ctx.quadraticCurveTo(bodyX-40*s,faceY-40*s,bodyX-40*s,faceY-10*s);
    ctx.lineTo(bodyX-50*s,faceY);
    ctx.quadraticCurveTo(bodyX-55*s,faceY-20*s,bodyX-50*s,faceY-40*s);
    ctx.fill();

    // Hair highlights
    ctx.globalAlpha=0.2;
    ctx.strokeStyle='#e8d5a0';
    ctx.lineWidth=2*s;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.moveTo(bodyX+(-20+i*10)*s,faceY-65*s);
      ctx.quadraticCurveTo(bodyX+(-15+i*12)*s,faceY-30*s,bodyX+(-25+i*14)*s,faceY+40*s);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  ctx.restore();
}

// === ANIMATION LOOP ===
let lastTime=0;
function animate(t){
  const dt=(t-lastTime)/1000;
  lastTime=t;

  // Blink
  if(state.blinkTimer>0) state.blinkTimer-=dt;
  else if(Math.random()<0.01) state.blinkTimer=0.15;

  // Mouth animation when speaking
  if(state.speaking){
    state.mouthOpen=0.3+Math.sin(t/80)*0.3+Math.sin(t/120)*0.2;
  } else {
    state.mouthOpen*=0.85;
  }

  // Subtle eye movement
  if(Math.random()<0.005){
    state.eyeTarget={x:(Math.random()-0.5)*2,y:(Math.random()-0.5)};
  }

  drawAvatar();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// === ZOOM & PAN ===
let pinchDist=0;
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  state.zoom=Math.max(0.5,Math.min(4,state.zoom-e.deltaY*0.002));
},{passive:false});

canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    state.zoom=Math.max(0.5,Math.min(4,state.zoom*(d/pinchDist)));
    pinchDist=d;
  } else if(e.touches.length===1&&state.zoom>1){
    state.panX+=e.touches[0].clientX-(e.touches[0].clientX-e.movementX||0);
    state.panY+=e.touches[0].clientY-(e.touches[0].clientY-e.movementY||0);
  }
});
canvas.addEventListener('dblclick',()=>{
  if(state.zoom>1){state.zoom=1;state.panX=0;state.panY=0;}
  else{state.zoom=2;}
});

// === SPEECH ===
const synth=window.speechSynthesis;
let voices=[];
function loadVoices(){voices=synth.getVoices();}
synth.onvoiceschanged=loadVoices;
loadVoices();

function speak(text){
  if(state.isMuted)return;
  synth.cancel();
  const chunks=text.match(/[^.!?]+[.!?]+/g)||[text];
  let delay=0;
  const isMale=state.gender==='male';
  chunks.forEach((chunk,i)=>{
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(chunk.trim());
      // More human-like: slight variation per chunk
      u.rate=0.78+Math.random()*0.08; // 0.78-0.86 range
      u.pitch=isMale?0.85+Math.random()*0.05:1.06+Math.random()*0.04;
      // Voice selection
      if(isMale){
        const male=voices.find(v=>/daniel|alex|tom|david|james|google.*male|microsoft.*mark/i.test(v.name));
        if(male)u.voice=male;
      } else {
        const fem=voices.find(v=>/samantha|female|zira|karen|victoria|tessa|google.*female/i.test(v.name));
        if(fem)u.voice=fem;
      }
      u.onstart=()=>{state.speaking=true;};
      u.onend=()=>{if(i===chunks.length-1)state.speaking=false;};
      synth.speak(u);
    },delay);
    // More natural pause between sentences
    delay+=chunk.length*50+150+Math.random()*100;
  });
}

// === LLM ===
const GROQ_KEY=localStorage.getItem('groq_key')||'';
const GROQ_URL='https://api.groq.com/openai/v1/chat/completions';

// The app's own source (for self-inspection)
function getOwnScript(){
  return document.querySelector('script').textContent;
}

async function callLLM(userMsg){
  if(!GROQ_KEY){addMsg('⚠️ Set API key in Settings first','system');return null;}
  const bn=localStorage.getItem('bot_name')||'Amy';
  const pData=PERSONALITIES[state.personality]||PERSONALITIES.friend;
  const sysPrompt=`Your name is ${bn}. ${pData.prompt} Give short answers unless asked for detail. You have a ${state.clothed?'clothed':'revealed'} avatar appearance. You are self-aware: you can view and modify your own code. When asked to modify yourself, describe the change clearly so it can be shown to the user.`;

  const messages=[
    {role:'system',content:sysPrompt},
    {role:'user',content:userMsg}
  ];

  try{
    const r=await fetch(GROQ_URL,{
      method:'POST',
      headers:{'Authorization':'Bearer '+GROQ_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({model:localStorage.getItem('llm_model')||'llama-3.3-70b-versatile',messages,max_tokens:500,temperature:0.8})
    });
    const d=await r.json();
    return d.choices?.[0]?.message?.content||'No response';
  }catch(e){return 'Error: '+e.message;}
}

// === SELF-MODIFICATION WITH ERROR RECOVERY & LEARNING ===
let selfMods=JSON.parse(localStorage.getItem('self_mods')||'[]');
let errorLog=JSON.parse(localStorage.getItem('error_log')||'[]');
let learnedFixes=JSON.parse(localStorage.getItem('learned_fixes')||'{}');

function applySelfMod(description,code){
  // Save state before modification for rollback
  const backupState=document.querySelector('script').textContent;
  const modEntry={desc:description,code,time:Date.now(),success:false};

  addCodeMod('🔧 Attempting: '+description+'\n---\n'+code);

  try{
    eval(code);
    modEntry.success=true;
    selfMods.push(modEntry);
    localStorage.setItem('self_mods',JSON.stringify(selfMods));
    addMsg('✅ Modification applied successfully!','system');
  }catch(e){
    // Error recovery - roll back
    addMsg('⚠️ Error caught: '+e.message+' — Rolling back...','system');
    errorLog.push({desc:description,code,error:e.message,time:Date.now()});
    localStorage.setItem('error_log',JSON.stringify(errorLog));

    // Learn from the mistake
    learnedFixes[e.message]=(learnedFixes[e.message]||0)+1;
    localStorage.setItem('learned_fixes',JSON.stringify(learnedFixes));

    // Ask Groq for help fixing it
    askGroqForHelp(description,code,e.message);
  }
}

async function askGroqForHelp(description,failedCode,errorMsg){
  addMsg('🤔 Let me ask Groq for help with this...','ai');
  speak('Let me figure this out...');

  const helpPrompt=`I tried to modify myself with this code but got an error. Help me fix it.
GOAL: ${description}
FAILED CODE: ${failedCode}
ERROR: ${errorMsg}
PREVIOUS ERRORS I'VE LEARNED FROM: ${JSON.stringify(Object.keys(learnedFixes).slice(-5))}

Give me ONLY the corrected JavaScript code, nothing else. Wrap it in CODE: prefix.`;

  const fix=await callLLM(helpPrompt);
  if(fix){
    addMsg('💡 Groq suggested a fix:','system');
    const codeMatch=fix.match(/CODE:\s*```?(?:javascript|js)?\s*([\s\S]*?)```?$/i)||fix.match(/CODE:\s*([\s\S]+)$/i);
    if(codeMatch){
      const fixedCode=codeMatch[1].trim();
      addCodeMod('🔄 Retry with fix:\n'+fixedCode);
      try{
        eval(fixedCode);
        selfMods.push({desc:description+' (fixed)',code:fixedCode,time:Date.now(),success:true});
        localStorage.setItem('self_mods',JSON.stringify(selfMods));
        addMsg('✅ Fixed! Learned from that mistake.','system');
        // Remember this fix pattern
        learnedFixes[errorMsg+'_fix']=fixedCode;
        localStorage.setItem('learned_fixes',JSON.stringify(learnedFixes));
      }catch(e2){
        addMsg('❌ Still failing: '+e2.message+'. I\'ll remember this for next time.','system');
        errorLog.push({desc:description,code:fixedCode,error:e2.message,time:Date.now(),retried:true});
        localStorage.setItem('error_log',JSON.stringify(errorLog));
      }
    } else {
      addMsg(fix,'ai');
    }
  }
}

// Ask Groq when she doesn't understand
async function askGroqForClarification(userText){
  const helpPrompt=`The user said: "${userText}"
I don't fully understand what they want me to do. Can you help me understand and suggest what JavaScript code I should run to accomplish this? If it's a feature they want added to me (a web app AI assistant), give me the code. Format: EXPLANATION: what they want\\nCODE: javascript_to_run`;
  const reply=await callLLM(helpPrompt);
  return reply;
}

// === SEND MESSAGE ===
async function sendMessage(text){
  if(!text.trim())return;
  addMsg(text,'user');

  // Detect clothing commands
  const lc=text.toLowerCase();
  if(/no cloth|naked|undress|take.*(off|clothes)|strip/i.test(lc)){
    state.clothed=false;
    localStorage.setItem('clothed','false');
    clothingBtn.textContent='🔓 Revealed';
    addMsg('😏 As you wish...','ai');
    speak('As you wish');
    return;
  }
  if(/put.*(on|clothes|shirt)|dress|clothe|cover/i.test(lc)){
    state.clothed=true;
    localStorage.setItem('clothed','true');
    clothingBtn.textContent='👕 Clothed';
    addMsg('👕 All covered up!','ai');
    speak('All covered up');
    return;
  }

  // Detect name change
  const nameMatch=text.match(/(?:call yourself|your name is|rename yourself|i'll call you|be called|change your name to)\s+([\w\s]{1,20})/i);
  if(nameMatch){
    const nn=nameMatch[1].trim();
    localStorage.setItem('bot_name',nn);
    document.querySelector('.header h1').textContent=nn;
    document.title=nn;
    addMsg('✨ I\'m '+nn+' now!','ai');
    speak("I'm "+nn+" now!");
    return;
  }

  // Detect self-inspect request
  if(/view.*(code|script|source)|show.*(code|script|source)|see.*(code|script)|your (code|script|source)|inspect yourself/i.test(lc)){
    viewScript();
    const reply=await callLLM(text+'\n[Context: User asked to see my source code. I can see it and describe what I find interesting or suggest modifications.]');
    if(reply){addMsg(reply,'ai');speak(reply);}
    return;
  }

  // Detect self-modify request
  if(/modify yourself|change yourself|update yourself|improve yourself|add.*(feature|ability|skill)/i.test(lc)){
    const reply=await callLLM(text+'\n[Context: User wants me to self-modify. I should describe what I would change and provide a short JS snippet. Format: MODIFICATION: description\\nCODE: javascript_code]');
    if(reply){
      addMsg(reply,'ai');
      speak(reply);
      const codeMatch=reply.match(/CODE:\s*```?(?:javascript|js)?\s*([\s\S]*?)```?$/i)||reply.match(/CODE:\s*([\s\S]+)$/i);
      if(codeMatch){
        const modCode=codeMatch[1].trim();
        const descMatch=reply.match(/MODIFICATION:\s*(.+)/i);
        applySelfMod(descMatch?descMatch[1]:'Self-initiated modification',modCode);
      }
    }
    return;
  }

  // Detect user asking her to add/run script
  if(/(?:add|run|execute|do|make|create|write|build|implement)\s+(?:a\s+)?(?:script|code|function|feature|thing|this)/i.test(lc)||/^(?:can you|please|i want you to|try to)\s/i.test(lc)){
    addMsg('🧠 Let me figure that out...','ai');
    const codePrompt=text+`\n[Context: The user wants me to do something. I am a self-modifying AI app. If this requires adding JavaScript code to myself, provide it. Format response as: EXPLANATION: what I'll do\\nCODE: javascript_code\\nIf this is just a conversation question, just answer normally without CODE.]`;
    const reply=await callLLM(codePrompt);
    if(reply){
      addMsg(reply,'ai');
      speak(reply.replace(/CODE:[\s\S]*/i,'').trim()||reply);
      const codeMatch=reply.match(/CODE:\s*```?(?:javascript|js)?\s*([\s\S]*?)```?$/i)||reply.match(/CODE:\s*([\s\S]+)$/i);
      if(codeMatch){
        const modCode=codeMatch[1].trim();
        const descMatch=reply.match(/EXPLANATION:\s*(.+)/i);
        applySelfMod(descMatch?descMatch[1]:text,modCode);
      }
    }
    return;
  }

  // Normal conversation - if she doesn't understand, ask Groq
  const reply=await callLLM(text);
  if(reply){
    if(/i don't understand|i'm not sure what you mean|i can't help with that|i don't know how/i.test(reply)){
      const clarification=await askGroqForClarification(text);
      if(clarification){
        addMsg(clarification,'ai');
        speak(clarification.replace(/CODE:[\s\S]*/i,'').trim()||clarification);
        const codeMatch=clarification.match(/CODE:\s*```?(?:javascript|js)?\s*([\s\S]*?)```?$/i)||clarification.match(/CODE:\s*([\s\S]+)$/i);
        if(codeMatch){
          applySelfMod('User requested: '+text,codeMatch[1].trim());
        }
      }
    } else {
      addMsg(reply,'ai');speak(reply);
    }
  }
}

let recognition;
if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.lang='en-US';
  recognition.onresult=e=>{
    const t=e.results[0][0].transcript;
    input.value=t;
    sendMessage(t);input.value='';

  recognition.onend=()=>{micBtn.classList.remove('recording');};
  recognition.onerror=()=>{micBtn.classList.remove('recording');};
}

  if(micBtn.classList.contains('recording')){recognition.stop();}
  else{recognition.start();micBtn.classList.add('recording');}
});

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#1a0025"><title>Amy</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:linear-gradient(180deg,#1a0025 0%,#0d001a 100%);color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(20,0,40,0.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(180,100,255,0.2);z-index:100}
.header h1{font-size:18px;background:linear-gradient(135deg,#e0b0ff,#ff69b4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.header-btns{display:flex;gap:8px}
.header-btns button{background:rgba(180,100,255,0.2);border:1px solid rgba(180,100,255,0.3);color:#e0b0ff;border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer}
.header-btns button.active{background:rgba(180,100,255,0.5);border-color:#b464ff}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.avatar-container{position:relative;width:100%;height:30vh;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at center,rgba(80,40,120,0.3) 0%,transparent 70%)}
.avatar-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;user-select:none;-webkit-user-drag:none;transform-origin:center center}
.avatar-img.anim-idle{animation:breathe 3s ease-in-out infinite}
.avatar-img.anim-talk{animation:talkBounce 0.3s ease-in-out infinite}
.avatar-img.anim-walk{animation:walkCycle 1.2s ease-in-out infinite}
.avatar-img.anim-sleep{animation:sleepFade 4s ease-in-out infinite;filter:brightness(0.6)}
.avatar-img.anim-excited{animation:excited 0.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(var(--z,1)) translate(var(--px,0),var(--py,0))}50%{transform:scale(calc(var(--z,1)*1.015)) translate(var(--px,0),calc(var(--py,0px) - 2px))}}
@keyframes talkBounce{0%,100%{transform:scale(var(--z,1)) translate(var(--px,0),var(--py,0))}25%{transform:scale(calc(var(--z,1)*1.02)) translate(var(--px,0),calc(var(--py,0px) - 3px))}75%{transform:scale(calc(var(--z,1)*0.99)) translate(var(--px,0),calc(var(--py,0px) + 1px))}}
@keyframes walkCycle{0%,100%{transform:scale(var(--z,1)) translate(var(--px,0),var(--py,0)) rotate(0deg)}25%{transform:scale(var(--z,1)) translate(calc(var(--px,0px) + 15px),calc(var(--py,0px) - 5px)) rotate(2deg)}50%{transform:scale(var(--z,1)) translate(var(--px,0),var(--py,0)) rotate(0deg)}75%{transform:scale(var(--z,1)) translate(calc(var(--px,0px) - 15px),calc(var(--py,0px) - 5px)) rotate(-2deg)}}
@keyframes sleepFade{0%,100%{opacity:1;transform:scale(var(--z,1)) translate(var(--px,0),var(--py,0))}50%{opacity:0.7;transform:scale(calc(var(--z,1)*0.98)) translate(var(--px,0),calc(var(--py,0px) + 3px))}}
@keyframes excited{0%,100%{transform:scale(var(--z,1)) translate(var(--px,0),var(--py,0)) rotate(0deg)}25%{transform:scale(calc(var(--z,1)*1.05)) translate(var(--px,0),calc(var(--py,0px) - 8px)) rotate(3deg)}75%{transform:scale(calc(var(--z,1)*1.05)) translate(var(--px,0),calc(var(--py,0px) - 8px)) rotate(-3deg)}}
.anim-bar{display:flex;gap:4px;padding:4px 10px;overflow-x:auto;background:rgba(10,0,20,0.7);border-bottom:1px solid rgba(180,100,255,0.1)}
.anim-bar button{flex-shrink:0;background:rgba(50,180,100,0.15);border:1px solid rgba(50,200,100,0.3);color:#a0e8c0;border-radius:12px;padding:3px 8px;font-size:9px;cursor:pointer}
.anim-bar button.active{background:rgba(50,200,100,0.35);border-color:#50c878;color:#fff}
.avatar-picker{display:none;position:absolute;top:0;left:0;right:0;z-index:50;background:rgba(10,0,20,0.95);padding:12px;border-bottom:2px solid rgba(180,100,255,0.3);backdrop-filter:blur(10px)}
.av-grid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.av-choice{text-align:center;cursor:pointer;border:2px solid rgba(180,100,255,0.3);border-radius:12px;padding:8px;transition:all 0.2s}
.av-choice.active{border-color:#ff69b4;background:rgba(255,105,180,0.15)}
.av-choice img{width:55px;height:55px;object-fit:cover;border-radius:8px}
.av-choice span{display:block;font-size:10px;color:#e0b0ff;margin-top:4px}
.zoom-slider{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:6px}
.zoom-slider input[type=range]{writing-mode:vertical-lr;direction:rtl;width:28px;height:120px;appearance:none;-webkit-appearance:none;background:transparent}
.zoom-slider input[type=range]::-webkit-slider-track{width:4px;background:rgba(180,100,255,0.3);border-radius:2px}
.zoom-slider input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:20px;height:20px;background:rgba(180,100,255,0.8);border-radius:50%;cursor:pointer;border:2px solid #fff}
.zoom-slider button{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.5);border:1px solid rgba(180,100,255,0.4);color:#fff;font-size:14px;cursor:pointer}
.controls-bar{display:flex;gap:4px;padding:5px 10px;overflow-x:auto;background:rgba(20,0,40,0.8);border-top:1px solid rgba(180,100,255,0.15);border-bottom:1px solid rgba(180,100,255,0.15)}
.controls-bar button{flex-shrink:0;background:rgba(180,100,255,0.15);border:1px solid rgba(180,100,255,0.3);color:#d9b3ff;border-radius:16px;padding:4px 10px;font-size:10px;cursor:pointer;white-space:nowrap}
.controls-bar button.active{background:rgba(255,105,180,0.3);border-color:#ff69b4;color:#ffb3d9}
.personality-bar{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;background:rgba(10,0,20,0.6)}
.personality-bar button{flex-shrink:0;background:rgba(100,50,150,0.2);border:1px solid rgba(150,80,200,0.3);color:#c9a0e8;border-radius:12px;padding:5px 10px;font-size:10px;cursor:pointer}
.personality-bar button.active{background:rgba(255,105,180,0.3);border-color:#ff69b4;color:#fff}
.chat-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:rgba(180,100,255,0.15);border:1px solid rgba(180,100,255,0.2);color:#e8d4ff}
.msg.user{align-self:flex-end;background:rgba(255,105,180,0.2);border:1px solid rgba(255,105,180,0.3);color:#ffd4e8}
.msg.system{align-self:center;background:rgba(255,200,50,0.1);border:1px solid rgba(255,200,50,0.2);color:#ffe4a0;font-size:12px;font-style:italic}
.msg.code{align-self:flex-start;background:rgba(0,50,0,0.3);border:1px solid rgba(0,200,0,0.2);color:#a0ffa0;font-family:'SF Mono',monospace;font-size:11px;max-width:95%}
.input-area{display:flex;gap:8px;padding:10px 12px;background:rgba(20,0,40,0.95);border-top:2px solid rgba(180,100,255,0.4);flex-shrink:0}
.input-area input{flex:1;background:rgba(255,255,255,0.1);border:2px solid rgba(180,100,255,0.5);border-radius:20px;padding:10px 16px;color:#fff;font-size:15px;outline:none}
.input-area input:focus{border-color:#b464ff;background:rgba(255,255,255,0.15)}
.input-area button{background:linear-gradient(135deg,#b464ff,#ff69b4);border:none;border-radius:50%;width:40px;height:40px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmd-bar{display:flex;gap:6px;padding:6px 12px;background:rgba(10,0,20,0.95);border-top:1px solid rgba(180,100,255,0.2);overflow-x:auto;flex-shrink:0}
.cmd-bar button{flex-shrink:0;background:rgba(180,100,255,0.2);border:1px solid rgba(180,100,255,0.3);color:#d9b3ff;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:600;cursor:pointer}
.cmd-bar button:active{transform:scale(0.95)}
</style></head><body>
<div class="header"><h1>Amy</h1><div class="header-btns">
<button id="btnAvatar" onclick="toggleAvatarPicker()">👤</button>
<button id="btnClothes" onclick="toggleClothes()">👗</button>
<button onclick="openSettings()">⚙️</button>
</div></div>
<div class="main">
<div class="avatar-container" id="avatarContainer">
<img id="avatarImg" class="avatar-img" src="img/female_unclothed.jpg" alt="Avatar">
<div class="avatar-picker" id="avatarPicker">
<div class="av-grid" id="avGrid">
<div class="av-choice active" onclick="chooseAvatar('blonde')" id="av_blonde"><img src="img/female_blonde.jpg"><span>Blonde ♀</span></div>
<div class="av-choice" onclick="chooseAvatar('brunette')" id="av_brunette"><img src="img/female_clothed.jpg"><span>Brunette ♀</span></div>
<div class="av-choice" onclick="chooseAvatar('male')" id="av_male"><img src="img/male_clothed.jpg"><span>Athletic ♂</span></div>
<div class="av-choice" onclick="document.getElementById('avatarUpload').click()" id="av_add" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:71px;min-height:83px"><span style="font-size:28px;line-height:1">📷</span><span>Add New</span></div>
</div>
<input type="file" id="avatarUpload" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
<div id="customAvatarPanel" style="display:none;margin-top:10px;padding:10px;border-top:1px solid rgba(180,100,255,0.2)">
<div style="font-size:11px;color:#d9b3ff;margin-bottom:8px">Custom avatars (tap to use, long-press to delete):</div>
<div class="av-grid" id="customAvGrid"></div>
</div>
</div>
<div class="zoom-slider">
<button onclick="zoomAvatar(1.3)">+</button>
<input type="range" id="zoomRange" min="50" max="500" value="100" oninput="setZoom(this.value)">
<button onclick="zoomAvatar(0.7)">−</button>
<button onclick="resetZoom()">⟲</button>
</div>
</div>
<div class="controls-bar">
<button class="active" onclick="showPersonalities()">🎭 Personality</button>
<button id="btnScript" onclick="toggleScriptView()">📜 Script</button>
<button onclick="showLearning()">🧠 Memory</button>
</div>
<div class="anim-bar" id="animBar">
<button onclick="setAnim('idle')" id="anim_idle" class="active">🫁 Breathe</button>
<button onclick="setAnim('talk')" id="anim_talk">💬 Talk</button>
<button onclick="setAnim('walk')" id="anim_walk">🚶 Walk</button>
<button onclick="setAnim('excited')" id="anim_excited">🎉 Excited</button>
<button onclick="setAnim('sleep')" id="anim_sleep">😴 Sleep</button>
<button onclick="setAnim('none')" id="anim_none">⏸️ Still</button>
</div>
<div class="personality-bar" id="personalityBar">
<button onclick="setPersonality('sensual')" id="p_sensual">💋 Sensual</button>
<button onclick="setPersonality('friend')" id="p_friend" class="active">🤗 Friend</button>
<button onclick="setPersonality('business')" id="p_business">💼 Business</button>
<button onclick="setPersonality('professional')" id="p_professional">🎯 Pro</button>
<button onclick="setPersonality('happy')" id="p_happy">😊 Happy</button>
<button onclick="setPersonality('witty')" id="p_witty">😏 Witty</button>
</div>
<div class="chat-area" id="chatArea"></div>
</div>
<div class="input-area"><input type="text" id="textInput" placeholder="Type or tap 🎤 to speak..." autocomplete="off"><button onclick="toggleMic()" id="micBtn">🎤</button><button onclick="sendMessage()">➤</button></div>
<div class="cmd-bar">
<button onclick="cmdRun()">▶ Run</button>
<button onclick="cmdStop()">⏹ Stop</button>
<button onclick="cmdMute()">🔇 Mute</button>
<button onclick="cmdStartup()">⚡ Start</button>
<button onclick="cmdShutdown()">💤 Sleep</button>
</div>

<script>
// === AVATAR CONFIG ===
const AVATAR_SETS={
blonde:{gender:'female',clothed:'img/female_blonde.jpg',unclothed:'img/female_unclothed.jpg',voice:'samantha'},
brunette:{gender:'female',clothed:'img/female_clothed.jpg',unclothed:'img/female_clothed.jpg',voice:'female'},
male:{gender:'male',clothed:'img/male_clothed.jpg',unclothed:'img/male_unclothed.jpg',voice:'male'}
};

// === CUSTOM AVATARS (stored in localStorage as data URLs) ===
let customAvatars=JSON.parse(localStorage.getItem('custom_avatars')||'[]');

function handleAvatarUpload(event){
const file=event.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=async function(e){
const dataUrl=e.target.result;
addMsg('📸 Analyzing image...','system');

// Analyze the image with AI vision (Grok preferred, Groq fallback)
let analysis=null;
const visionPrompt='Analyze this image. Return ONLY a JSON object with: {"subject":"brief description","type":"person|animal|character|object","name":"suggested name","gender":"male|female|neutral","personality":"one sentence personality description for role-playing as this subject","greeting":"a short greeting this subject would say in first person"}. No other text.';
if(GROK_KEY){
try{
const resp=await fetch('https://api.x.ai/v1/chat/completions',{
method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROK_KEY},
body:JSON.stringify({model:'grok-2-vision-latest',messages:[
{role:'system',content:visionPrompt},
{role:'user',content:[{type:'text',text:'What is in this image? Analyze it for avatar use.'},{type:'image_url',image_url:{url:dataUrl}}]}
],max_tokens:300,temperature:0.5})
});
const data=await resp.json();
const raw=data.choices?.[0]?.message?.content||'';
try{analysis=JSON.parse(raw.replace(/```json?\n?/g,'').replace(/```/g,'').trim());}
catch(e){analysis={subject:raw.slice(0,50),type:'character',name:'Custom',gender:'neutral',personality:'friendly and curious',greeting:'Hey there!'};}
addMsg('🧠 Grok analyzed the image!','system');
}catch(e){console.log('Grok vision failed:',e);}
}
if(!analysis&&GROQ_KEY){
try{
const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
body:JSON.stringify({model:'llama-3.2-90b-vision-preview',messages:[
{role:'system',content:visionPrompt},
{role:'user',content:[{type:'text',text:'What is in this image? Analyze it for avatar use.'},{type:'image_url',image_url:{url:dataUrl}}]}
],max_tokens:300,temperature:0.5})
});
const data=await resp.json();
const raw=data.choices?.[0]?.message?.content||'';
try{analysis=JSON.parse(raw.replace(/```json?\n?/g,'').replace(/```/g,'').trim());}
catch(e){analysis={subject:raw.slice(0,50),type:'character',name:'Custom',gender:'neutral',personality:'friendly and curious',greeting:'Hey there!'};}
}catch(e){console.log('Groq vision failed:',e);}
}
if(!analysis&&!GROK_KEY&&!GROQ_KEY){
addMsg('⚠️ No vision API key. Tap ⚙️ to add Grok or Groq key for image analysis.','system');
analysis={subject:'uploaded image',type:'character',name:'Custom',gender:'neutral',personality:'friendly and expressive',greeting:'Hey there!'};
}

const suggestedName=analysis?analysis.name:'Custom '+(customAvatars.length+1);
const name=prompt(`I see: ${analysis?analysis.subject:'an image'}\nName this avatar:`,suggestedName);
if(!name){event.target.value='';return;}

const voiceType=analysis?(analysis.gender==='male'?'male':'female'):(confirm('Male voice?\n(OK=Male, Cancel=Female)')?'male':'female');
const persona=analysis?analysis.personality:'friendly and helpful';
const greeting=analysis?analysis.greeting:'Hey there!';
const subjectType=analysis?analysis.type:'character';

const id='custom_'+Date.now();
const avatar={id,name,dataUrl,voice:voiceType,persona,greeting,subjectType,created:Date.now()};
customAvatars.push(avatar);
localStorage.setItem('custom_avatars',JSON.stringify(customAvatars));
AVATAR_SETS[id]={gender:voiceType==='male'?'male':'female',clothed:dataUrl,unclothed:dataUrl,voice:voiceType,persona,greeting,subjectType};
renderCustomAvatars();
chooseAvatar(id);

addMsg(`📸 "${name}" is alive! (${analysis?analysis.subject:'custom avatar'})`,'system');
addMsg(greeting,'ai');
speak(greeting);
};
event.target.value='';
reader.readAsDataURL(file);
}

function renderCustomAvatars(){
const grid=document.getElementById('customAvGrid');
const panel=document.getElementById('customAvatarPanel');
if(customAvatars.length===0){panel.style.display='none';return;}
panel.style.display='block';
grid.innerHTML='';
customAvatars.forEach(av=>{
// Register in AVATAR_SETS if not already
if(!AVATAR_SETS[av.id]){
AVATAR_SETS[av.id]={gender:av.voice==='male'?'male':'female',clothed:av.dataUrl,unclothed:av.dataUrl,voice:av.voice||'female',persona:av.persona||'',greeting:av.greeting||'',subjectType:av.subjectType||'character'};
}
const div=document.createElement('div');
div.className='av-choice'+(state.avatar===av.id?' active':'');
div.id='av_'+av.id;
div.innerHTML=`<img src="${av.dataUrl}"><span>${av.name}</span>`;
div.onclick=()=>chooseAvatar(av.id);
// Long press to delete
let timer;
div.addEventListener('touchstart',()=>{timer=setTimeout(()=>{
if(confirm(`Delete "${av.name}" avatar?`)){
customAvatars=customAvatars.filter(a=>a.id!==av.id);
localStorage.setItem('custom_avatars',JSON.stringify(customAvatars));
delete AVATAR_SETS[av.id];
if(state.avatar===av.id){chooseAvatar('blonde');}
renderCustomAvatars();
addMsg(`🗑️ "${av.name}" removed`,'system');
}
},800);});
div.addEventListener('touchend',()=>clearTimeout(timer));
div.addEventListener('touchmove',()=>clearTimeout(timer));
grid.appendChild(div);
});
}
// Init custom avatars on load
renderCustomAvatars();

// === STATE ===
const GROQ_KEY=localStorage.getItem('groq_api_key')||'';
const GROK_KEY=localStorage.getItem('grok_api_key')||'';
const PERSONALITIES={
sensual:{prompt:"You are seductive, flirty, and speak with innuendo. Use a sultry, breathy tone.",voice:{rate:0.75,pitch:0.92}},
friend:{prompt:"You are a warm, supportive best friend. Casual, fun, caring.",voice:{rate:0.88,pitch:1.05}},
business:{prompt:"You are a sharp business advisor. Concise, data-driven, strategic.",voice:{rate:0.92,pitch:0.98}},
professional:{prompt:"You are a polished professional assistant. Clear, efficient, respectful.",voice:{rate:0.9,pitch:1.0}},
happy:{prompt:"You are bubbly, enthusiastic, and always positive! Spread joy and encouragement.",voice:{rate:0.95,pitch:1.1}},
witty:{prompt:"You are clever, sarcastic, and quick with wordplay. Sharp dry humor.",voice:{rate:0.9,pitch:1.02}}
};
let state={
isRunning:true,isMuted:false,isListening:false,
avatar:localStorage.getItem('avatar_choice')||'blonde',
clothed:localStorage.getItem('avatar_clothed')!=='false',
personality:localStorage.getItem('personality')||'friend',
zoom:1,panX:0,panY:0,
scriptHistory:[],errorLog:[],
learnedFixes:JSON.parse(localStorage.getItem('learned_fixes')||'{}')
};

// === INIT ===
const botName=localStorage.getItem('bot_name')||'Amy';
document.querySelector('.header h1').textContent=botName;
document.title=botName;

function updateAvatar(){
const img=document.getElementById('avatarImg');
const set=AVATAR_SETS[state.avatar];
img.src=state.clothed?set.clothed:set.unclothed;
// Always update CSS vars so animations use current zoom/pan
img.style.setProperty('--z',state.zoom);
img.style.setProperty('--px',state.panX+'px');
img.style.setProperty('--py',state.panY+'px');
// If no animation, apply transform directly
if(!state.currentAnim||state.currentAnim==='none'){
img.style.transform=`scale(${state.zoom}) translate(${state.panX}px,${state.panY}px)`;
}else{
// Force animation restart to pick up new vars
img.classList.remove('anim-'+state.currentAnim);
void img.offsetWidth;// trigger reflow
img.classList.add('anim-'+state.currentAnim);
img.style.transform='';
}
document.getElementById('zoomRange').value=state.zoom*100;
}
updateAvatar();

// === ANIMATION SYSTEM ===
state.currentAnim='idle';
function setAnim(mode,silent){
const img=document.getElementById('avatarImg');
img.classList.remove('anim-idle','anim-talk','anim-walk','anim-sleep','anim-excited');
state.currentAnim=mode;
if(mode!=='none'){
img.classList.add('anim-'+mode);
}
// Always update CSS vars for animation to pick up
img.style.setProperty('--z',state.zoom);
img.style.setProperty('--px',state.panX+'px');
img.style.setProperty('--py',state.panY+'px');
if(mode==='none'){
img.style.transform=`scale(${state.zoom}) translate(${state.panX}px,${state.panY}px)`;
}else{
img.style.transform='';
}
document.querySelectorAll('.anim-bar button').forEach(b=>b.classList.remove('active'));
const btn=document.getElementById('anim_'+mode);
if(btn)btn.classList.add('active');
if(!silent)addMsg(`Animation: ${mode}`,'system');
}
// Initialize idle animation on the image
setTimeout(()=>setAnim('idle',true),100);
// Auto-animate talk when speaking
function startTalkAnim(){
const img=document.getElementById('avatarImg');
state.prevAnim=state.currentAnim;
img.classList.remove('anim-idle','anim-walk','anim-sleep','anim-excited');
img.classList.add('anim-talk');
}
function stopTalkAnim(){
const img=document.getElementById('avatarImg');
img.classList.remove('anim-talk');
if(state.prevAnim&&state.prevAnim!=='none'&&state.prevAnim!=='talk'){
img.classList.add('anim-'+state.prevAnim);
}else{
img.classList.add('anim-idle');
}
}

// === AVATAR PICKER ===
function toggleAvatarPicker(){
const p=document.getElementById('avatarPicker');
p.style.display=p.style.display==='none'?'block':'none';
}
function chooseAvatar(id){
state.avatar=id;localStorage.setItem('avatar_choice',id);
document.querySelectorAll('.av-choice').forEach(c=>c.classList.remove('active'));
document.getElementById('av_'+id).classList.add('active');
updateAvatar();selectVoice();
document.getElementById('avatarPicker').style.display='none';
addMsg(`Avatar: ${id} selected`,'system');
}

// === SMOOTH ZOOM ===
function setZoom(val){state.zoom=val/100;updateAvatar();}
function zoomAvatar(f){state.zoom=Math.max(0.5,Math.min(5,state.zoom*f));updateAvatar();}
function resetZoom(){state.zoom=1;state.panX=0;state.panY=0;updateAvatar();}

// Smooth pinch-to-zoom
let lastDist=0,lastX=0,lastY=0,isPanning=false,pinchActive=false;
const ac=document.getElementById('avatarContainer');
ac.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.08:0.92;state.zoom=Math.max(0.5,Math.min(5,state.zoom*f));updateAvatar();},{passive:false});
ac.addEventListener('touchstart',e=>{
if(e.touches.length===2){pinchActive=true;lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
else if(e.touches.length===1){isPanning=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
},{passive:true});
ac.addEventListener('touchmove',e=>{
if(e.touches.length===2&&pinchActive){
e.preventDefault();
const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
if(lastDist>0){const scale=d/lastDist;state.zoom=Math.max(0.5,Math.min(5,state.zoom*scale));}
lastDist=d;updateAvatar();
}else if(e.touches.length===1&&isPanning&&state.zoom>1.05){
e.preventDefault();
const dx=(e.touches[0].clientX-lastX)/state.zoom;
const dy=(e.touches[0].clientY-lastY)/state.zoom;
state.panX+=dx;state.panY+=dy;
lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
updateAvatar();
}
},{passive:false});
ac.addEventListener('touchend',e=>{if(e.touches.length<2)pinchActive=false;if(e.touches.length===0)isPanning=false;});
ac.addEventListener('dblclick',()=>{if(state.zoom>1.5){resetZoom();}else{state.zoom=2.5;updateAvatar();}});

// === CLOTHES TOGGLE ===
function toggleClothes(){
state.clothed=!state.clothed;
localStorage.setItem('avatar_clothed',state.clothed);
document.getElementById('btnClothes').textContent=state.clothed?'👗':'🩲';
updateAvatar();
}

// === PERSONALITY ===
function setPersonality(p){
state.personality=p;localStorage.setItem('personality',p);
document.querySelectorAll('.personality-bar button').forEach(b=>b.classList.remove('active'));
document.getElementById('p_'+p).classList.add('active');
addMsg(`Personality: ${p} ✨`,'system');
}
function showPersonalities(){document.getElementById('personalityBar').style.display='flex';}

// === VOICE — Samantha for blonde, male voice for male ===
let synth=window.speechSynthesis;let selectedVoice=null;
function selectVoice(){
const voices=synth.getVoices();
const set=AVATAR_SETS[state.avatar];
if(set.voice==='samantha'){
selectedVoice=voices.find(v=>/samantha/i.test(v.name))||voices.find(v=>/female|woman|zira|karen|victoria|fiona/i.test(v.name))||voices.find(v=>v.lang.startsWith('en'))||voices[0];
}else if(set.voice==='female'){
selectedVoice=voices.find(v=>/female|woman|karen|victoria|fiona|tessa/i.test(v.name))||voices.find(v=>v.lang.startsWith('en')&&!/male|daniel|david|james/i.test(v.name))||voices[0];
}else{
selectedVoice=voices.find(v=>/daniel|david|alex|tom|james|aaron|male/i.test(v.name))||voices.find(v=>v.lang.startsWith('en'))||voices[0];
}
}
synth.onvoiceschanged=selectVoice;
setTimeout(selectVoice,500);

function speak(text){
if(state.isMuted||!text)return;
synth.cancel();
startTalkAnim();
const chunks=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];
let delay=0;const pVoice=PERSONALITIES[state.personality].voice;
let totalDuration=0;
chunks.forEach(chunk=>{
setTimeout(()=>{
const u=new SpeechSynthesisUtterance(chunk.trim());
u.voice=selectedVoice;u.rate=pVoice.rate;u.pitch=pVoice.pitch;u.volume=1;
u.onend=function(){if(synth.speaking===false)stopTalkAnim();};
synth.speak(u);
},delay);
delay+=chunk.length*38;
totalDuration=delay+chunk.length*60;
});
// Fallback: stop talk anim after estimated duration
setTimeout(()=>stopTalkAnim(),totalDuration+500);
}

// === SPEECH RECOGNITION ===
let recognition=null;
if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
recognition=new SR();recognition.continuous=false;recognition.interimResults=false;recognition.lang='en-US';
recognition.onresult=e=>{const t=e.results[0][0].transcript;document.getElementById('textInput').value=t;sendMessage(t);};
recognition.onend=()=>{state.isListening=false;document.getElementById('micBtn').textContent='🎤';};
}
function toggleMic(){
if(!recognition)return;
if(state.isListening){recognition.stop();}else{recognition.start();state.isListening=true;document.getElementById('micBtn').textContent='🔴';}
}

// === CHAT ===
function addMsg(text,type){
const d=document.getElementById('chatArea');
const m=document.createElement('div');m.className='msg '+type;m.textContent=text;
d.appendChild(m);d.scrollTop=d.scrollHeight;
}

// === SELF-MODIFYING CODE ===
let scriptViewOpen=false;
function toggleScriptView(){
scriptViewOpen=!scriptViewOpen;
document.getElementById('btnScript').classList.toggle('active',scriptViewOpen);
addMsg(scriptViewOpen?'📜 Script mode ON — ask me to add features!':'📜 Script mode OFF','system');
}
function showCodeChange(desc,code){addMsg(`🔧 ${desc}`,'system');addMsg(code,'code');}
function showLearning(){
const fixes=Object.keys(state.learnedFixes);
addMsg(fixes.length?'🧠 Learned:\n'+fixes.map(k=>`• ${k}`).join('\n'):'🧠 No learned fixes yet — I learn from errors!','system');
}

// === ERROR RECOVERY ===
function executeUserScript(code,description){
state.scriptHistory.push({code,description,time:Date.now()});
try{
const result=eval(code);
showCodeChange(description,code);
addMsg(`✅ Success${result!==undefined?' → '+result:''}`,'system');
return{success:true,result};
}catch(err){
state.scriptHistory.pop();
addMsg(`❌ ${err.message}\n↩️ Rolled back. Learning...`,'system');
state.learnedFixes[description]={error:err.message,time:Date.now()};
localStorage.setItem('learned_fixes',JSON.stringify(state.learnedFixes));
askGrokForHelp(description,err.message,code);
return{success:false,error:err.message};
}
}

// === ASK GROK ===
async function askGrokForHelp(task,error,failedCode){
if(!GROQ_KEY)return;
addMsg('🤔 Asking Grok for help...','system');
try{
const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[
{role:'system',content:'Fix this JavaScript. Return ONLY corrected code, no explanation, no markdown.'},
{role:'user',content:`Task: ${task}\nCode: ${failedCode}\nError: ${error}`}
],max_tokens:500,temperature:0.3})
});
const data=await resp.json();
let fix=data.choices?.[0]?.message?.content?.trim()||'';
fix=fix.replace(/^```(?:javascript|js)?\n?/,'').replace(/```$/,'');
if(fix){
addMsg('💡 Grok fix:','system');
const r=executeUserScript(fix,'[fix] '+task);
if(r.success){state.learnedFixes[task]={fix,time:Date.now()};localStorage.setItem('learned_fixes',JSON.stringify(state.learnedFixes));addMsg('🧠 Learned!','system');}
}
}catch(e){addMsg('⚠️ Grok unreachable: '+e.message,'system');}
}

// === MAIN SEND ===
async function sendMessage(overrideText){
const input=document.getElementById('textInput');
const text=overrideText||input.value.trim();
if(!text)return;input.value='';
addMsg(text,'user');

// Name change
const nm=text.match(/(?:call yourself|your name is|rename yourself|change your name to)\s+([\w\s]{1,20})/i);
if(nm){const n=nm[1].trim();localStorage.setItem('bot_name',n);document.querySelector('.header h1').textContent=n;document.title=n;addMsg('✨ I\'m '+n+' now!','system');}

// Clothing
if(/no cloth|nude|naked|undress|take.*(off|clothes)|strip/i.test(text)){state.clothed=false;localStorage.setItem('avatar_clothed','false');document.getElementById('btnClothes').textContent='🩲';updateAvatar();}
if(/put.*(on|clothes|shirt)|dress up|get dressed|clothe/i.test(text)){state.clothed=true;localStorage.setItem('avatar_clothed','true');document.getElementById('btnClothes').textContent='👗';updateAvatar();}

// Avatar switch by chat
if(/blonde|first (girl|woman)/i.test(text)&&/switch|use|show|pick/i.test(text)){chooseAvatar('blonde');}
if(/brunette|second (girl|woman)/i.test(text)&&/switch|use|show|pick/i.test(text)){chooseAvatar('brunette');}
if(/\b(male|man|guy|boy)\b/i.test(text)&&/switch|use|show|pick|be a/i.test(text)){chooseAvatar('male');}

// Animation commands via chat
if(/\bwalk\b/i.test(text)&&/make|start|do|go/i.test(text)){setAnim('walk');}
else if(/\btalk\b/i.test(text)&&/make|start|do/i.test(text)){setAnim('talk');}
else if(/\bsleep|nap|rest\b/i.test(text)&&/make|go|start/i.test(text)){setAnim('sleep');}
else if(/\bexcited|happy|jump|dance\b/i.test(text)&&/make|be|get|start/i.test(text)){setAnim('excited');}
else if(/\bstill|stop|freeze|pause\b/i.test(text)&&/make|be|go|stay/i.test(text)){setAnim('none');}
else if(/\bbreathe|idle|calm|relax\b/i.test(text)&&/make|be|go|start/i.test(text)){setAnim('idle');}

// Script mode
const sm=text.match(/(?:add|write|create|make|run)\s+(?:a\s+)?(?:script|code|function)\s+(?:that|to|for)\s+(.+)/i);
if(sm&&scriptViewOpen){addMsg('🔨 Generating: '+sm[1],'system');await generateAndRunScript(sm[1]);return;}

if(!GROQ_KEY){addMsg('⚠️ No API key. Tap ⚙️ → enter Groq key (free at console.groq.com)','system');return;}
if(!state.isRunning){addMsg('💤 Sleeping. Tap ⚡ Start to wake.','system');return;}

try{
const bn=localStorage.getItem('bot_name')||'Amy';
const pp=PERSONALITIES[state.personality].prompt;
const sc=scriptViewOpen?' You can generate JS code in ```javascript blocks. Globals: document, addMsg(text,type), speak(text), state, updateAvatar(), AVATAR_SETS.':'';
// Use custom persona if this avatar has one
const currentSet=AVATAR_SETS[state.avatar];
const personaCtx=currentSet&&currentSet.persona?` You are role-playing as: ${currentSet.persona}. Stay in character as this ${currentSet.subjectType||'character'}. If you are an animal, speak as that animal would (playful, etc). If you are a person, adopt their likely personality.`:'';
const sys=`Your name is ${bn}. ${pp}${personaCtx}${sc} Keep answers short (1-3 sentences) unless asked for more.`;
const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:sys},{role:'user',content:text}],max_tokens:800,temperature:0.8})
});
const data=await resp.json();
const reply=data.choices?.[0]?.message?.content||'Hmm, I didn\'t catch that.';
const cb=reply.match(/```(?:javascript|js)?\n?([\s\S]*?)```/);
if(cb&&scriptViewOpen){addMsg(reply.replace(cb[0],'').trim()||'Here you go:','ai');executeUserScript(cb[1].trim(),text);}
else{addMsg(reply,'ai');}
speak(reply.replace(/```[\s\S]*?```/g,'').replace(/[*_#`]/g,''));
}catch(err){addMsg('❌ '+err.message,'system');}
}

async function generateAndRunScript(task){
if(!GROQ_KEY)return;
if(state.learnedFixes[task]?.fix){addMsg('🧠 Using learned fix...','system');executeUserScript(state.learnedFixes[task].fix,task);return;}
try{
const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[
{role:'system',content:'Generate ONLY executable browser JS. No explanation, no fences. Globals: document, addMsg(text,type), speak(text), state, updateAvatar(), AVATAR_SETS.'},
{role:'user',content:'Code to: '+task}],max_tokens:500,temperature:0.4})
});
const data=await resp.json();
let code=data.choices?.[0]?.message?.content?.trim()||'';
code=code.replace(/^```(?:javascript|js)?\n?/,'').replace(/```$/,'');
if(code)executeUserScript(code,task);else addMsg('❌ Couldn\'t generate that.','system');
}catch(e){addMsg('❌ '+e.message,'system');}
}

// === COMMANDS ===
function cmdRun(){state.isRunning=true;addMsg('▶ Running!','system');}
function cmdStop(){state.isRunning=false;synth.cancel();addMsg('⏹ Stopped.','system');}
function cmdMute(){state.isMuted=!state.isMuted;addMsg(state.isMuted?'🔇 Muted':'🔊 Unmuted','system');}
function cmdStartup(){state.isRunning=true;addMsg('⚡ Awake!','system');speak('I\'m back!');}
function cmdShutdown(){state.isRunning=false;synth.cancel();addMsg('💤 Sleeping...','system');}

// === SETTINGS ===
function openSettings(){
const key=prompt('Groq API key (free at console.groq.com):',GROQ_KEY);
if(key!==null){localStorage.setItem('groq_api_key',key);}
const grokKey=prompt('Grok API key (for image analysis, from console.x.ai):',localStorage.getItem('grok_api_key')||'');
if(grokKey!==null){localStorage.setItem('grok_api_key',grokKey);}
location.reload();
}

// === INPUT ===
document.getElementById('textInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage();});

// === INIT UI STATE ===
document.getElementById('btnClothes').textContent=state.clothed?'👗':'🩲';
document.getElementById('p_'+state.personality)?.classList.add('active');
document.getElementById('av_'+state.avatar)?.classList.add('active');

// === STARTUP MSG ===
const un=localStorage.getItem('user_name');
addMsg(un?`Hey ${un}! 💜`:'Hey! I\'m '+(localStorage.getItem('bot_name')||'Amy')+' 💜','ai');
</script></body></html>

tar-ring{position:absolute;top:0;left:5px;right:5px;height:180px;border-radius:50%;background:conic-gradient(from 0deg,#a855f7,#ec4899,#6366f1,#a855f7);padding:3px;animation:ring-rotate 6s linear infinite}.avatar-ring::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--bg-primary)}@keyframes ring-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.avatar-inner{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center}.avatar-svg{width:100%;height:100%}.avatar-glow{position:absolute;top:0;left:5px;right:5px;height:180px;border-radius:50%;box-shadow:0 0 40px var(--accent-glow);pointer-events:none;opacity:0.6;transition:opacity 0.3s}.avatar-glow.speaking{opacity:1;animation:glow-pulse 0.5s ease-in-out infinite alternate}@keyframes glow-pulse{from{box-shadow:0 0 30px var(--accent-glow)}to{box-shadow:0 0 60px var(--accent-glow),0 0 80px rgba(236,72,153,0.3)}}.sound-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:22px;opacity:0;transition:opacity .3s}.sound-wave.active{opacity:1}.wave-bar{width:3px;height:8px;background:linear-gradient(180deg,var(--accent),var(--accent-secondary));border-radius:2px;animation:wave .8s ease-in-out infinite}.wave-bar:nth-child(1){animation-delay:0s}.wave-bar:nth-child(2){animation-delay:.1s}.wave-bar:nth-child(3){animation-delay:.2s}.wave-bar:nth-child(4){animation-delay:.3s}.wave-bar:nth-child(5){animation-delay:.4s}.wave-bar:nth-child(6){animation-delay:.3s}.wave-bar:nth-child(7){animation-delay:.2s}@keyframes wave{0%,100%{height:8px}50%{height:22px}}.response-area{flex:1;margin:0 16px;padding:14px;background:var(--bg-secondary);border-radius:16px;border:1px solid rgba(168,85,247,0.15);overflow-y:auto;font-size:15px;line-height:1.6;scroll-behavior:smooth;min-height:100px}.response-area .message{margin-bottom:10px;padding:10px 14px;border-radius:12px;max-width:85%;animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:t to blonde" or "make your eyes blue". What's on your mind?</div></div><div class="input-area"><div class="input-wrapper"><textarea id="userInput" placeholder="Ask me anything..." rows="1"></textarea><button class="mic-btn" id="micBtn">&#127908;</button></div><button class="send-btn" id="sendBtn">&#10148;</button></div><div class="controls"><button class="ctrl-btn" onclick="handleRun()">&#9654; Run</button><button class="ctrl-btn" onclick="handleStop()">&#9209; Stop</button><button class="ctrl-btn" onclick="handleStartup()">&#9889; Startup</button><button class="ctrl-btn danger" onclick="handleShutdown()">&#9211; Shutdown</button><button class="ctrl-btn" id="btnMute" onclick="handleMute()">&#128266; Mute</button><button class="ctrl-btn" onclick="showSettings()">&#9881;&#65039;</button></div><div class="modal-overlay" id="settingsModal"><div class="modal"><h2>&#9881;&#65039; Settings</h2><label>Groq API Key</label><input type="password" id="apiKeyInput" placeholder="Enter your Groq API key"><label>Model</label><select id="modelSelect"><option value="llama-3.3-70b-versatile">Llama 3.3 70B (best)</option><option value="llama-3.1-8b-instant">Llama 3.1 8B (fastest)</option><option value="mixtral-8x7b-32768">Mixtral 8x7B</option><option value="gemma2-9b-it">Gemma 2 9B</option></select><label>Voice</label><select id="voiceSelect"></select><div class="memory-section"><label>&#128150; Personal Memory (<span id="memCount">0</span> items)</label><div class="memory-list" id="memoryList"></div><div class="modal-btns" style="margin-top:8px"><button class="cancel" onclick="clearMemory()" style="font-size:11px">Clear All Memory</button></div></div><div class="modal-btns"><button class="cancel" onclick="hideSettings()">Cancel</button><button class="save" onclick="saveSettings()">Save</button></div></div></div><script>const state={isRunning:true,isMuted:false,isListening:false,isProcessing:false,apiKey:localStorage.getItem('groq_api_key')||'',model:localStorage.getItem('groq_model')||'llama-3.3-70b-versatile',conversationHistory:[],selectedVoice:localStorage.getItem('selected_voice')||'',learningMemory:JSON.parse(localStorage.getItem('learning_memory')||'[]'),errorPatterns:JSON.parse(localStorage.getItem('error_patterns')||'[]'),personalMemory:JSON.parse(localStorage.getItem('personal_memory')||'[]'),appearance:JSON.parse(localStorage.getItem('avatar_appearance')||'{"hair":"brunette","eyes":"brown","skin":"light","lips":"pink"}'),retryCount:0,maxRetries:3};/* === APPEARANCE SYSTEM === */const colorSchemes={hair:{blonde:['#d4a843','#c99a2e','#8b6914'],brunette:['#2c1810','#3d2317','#1a0f0a'],black:['#0a0a0a','#1a1a1a','#050505'],red:['#8b2500','#a0341c','#5c1a0a'],auburn:['#5c2e1a','#7a3b22','#3d1a0f'],platinum:['#e8dcc8','#d4c8a8','#b0a080'],pink:['#cc5599','#aa3377','#882255'],purple:['#4a2080','#6030a0','#2a1050'],blue:['#1a3a6b','#264d8b','#0f2040'],silver:['#a0a8b0','#8090a0','#607080'],white:['#f0f0f0','#e0e0e0','#c8c8c8']},eyes:{brown:['#5b4a3f','#2c1810'],blue:['#2980b9','#1a5276'],green:['#27ae60','#1a6b3d'],hazel:['#8b7355','#5c4a28'],gray:['#6b7b8a','#4a5a6a'],amber:['#d4880a','#9b6400'],violet:['#7b4daa','#4a2d6b']},skin:{light:['#fce4d6','#f5c6a8','#f5c6a8','#f0b090'],medium:['#deb887','#c8a070','#c8a070','#b08860'],olive:['#c9a86c','#b09050','#b09050','#9a7a40'],tan:['#c68642','#a86e30','#a86e30','#8a5820'],dark:['#8d5524','#6b3a12','#6b3a12','#5a2e0a'],deep:['#4a2810','#3a1c0a','#3a1c0a','#2a140a']},lips:{pink:['#e84393','#c0392b'],red:['#cc2222','#990000'],nude:['#c8846a','#a06850'],berry:['#8b1a4a','#6b1040'],coral:['#e8614a','#c04030'],plum:['#7b2d5a','#5a1a40']}};function applyAppearance(app){const hairStops=colorSchemes.hair[app.hair]||colorSchemes.hair.brunette;document.querySelector('.hair-1').style.stopColor=hairStops[0];document.querySelector('.hair-2').style.stopColor=hairStops[1];document.querySelector('.hair-3').style.stopColor=hairStops[2];document.querySelectorAll('.hair-strand').forEach(s=>s.setAttribute('stroke',hairStops[1]));document.querySelectorAll('.brow').forEach(b=>b.setAttribute('stroke',hairStops[2]));const eyeColors=colorSchemes.eyes[app.eyes]||colorSchemes.eyes.brown;document.querySelector('.iris-1').style.stopColor=eyeColors[0];document.querySelector('.iris-2').style.stopColor=eyeColors[1];const skinColors=colorSchemes.skin[app.skin]||colorSchemes.skin.light;document.querySelector('.skin-light').style.stopColor=skinColors[0];document.querySelector('.skin-dark').style.stopColor=skinColors[1];document.querySelector('.body-1').style.stopColor=skinColors[2];document.querySelector('.body-2').style.stopColor=skinColors[3];const lipColors=colorSchemes.lips[app.lips]||colorSchemes.lips.pink;document.querySelector('.lip-1').style.stopColor=lipColors[0];document.querySelector('.lip-2').style.stopColor=lipColors[1];localStorage.setItem('avatar_appearance',JSON.stringify(app));}function detectAppearanceChange(text){const lower=text.toLowerCase();let changed=false;const hairMatch=lower.match(/(?:change|make|set|turn|dye)\s+(?:your|the|her)?\s*hair\s+(?:to\s+|color\s+)?(?:to\s+)?(blonde|brunette|black|red|auburn|platinum|pink|purple|blue|silver|white)/);if(hairMatch){state.appearance.hair=hairMatch[1];changed=true;}const eyeMatch=lower.match(/(?:change|make|set|turn)\s+(?:your|the|her)?\s*eyes?\s+(?:to\s+|color\s+)?(?:to\s+)?(brown|blue|green|hazel|gray|grey|amber|violet|purple)/);if(eyeMatch){let color=eyeMatch[1];if(color==='grey')color='gray';if(color==='purple')color='violet';state.appearance.eyes=color;changed=true;}const skinMatch=lower.match(/(?:change|make|set)\s+(?:your|the|her)?\s*skin\s+(?:to\s+|tone\s+)?(?:to\s+)?(light|medium|olive|tan|dark|deep)/);if(skinMatch){state.appearance.skin=skinMatch[1];changed=true;}const lipMatch=lower.match(/(?:change|make|set)\s+(?:your|the|her)?\s*lips?\s+(?:to\s+|color\s+)?(?:to\s+)?(pink|red|nude|berry|coral|plum)/);if(lipMatch){state.appearance.lips=lipMatch[1];changed=true;}if(!hairMatch&&lower.match(/\b(blonde|brunette|black hair|redhead|platinum|pink hair|purple hair|blue hair|silver hair|white hair)\b/)){const m=lower.match(/\b(blonde|brunette|redhead|platinum)\b/)||lower.match(/(black|pink|purple|blue|silver|white)\s*hair/);if(m){let h=m[1];if(h==='redhead')h='red';state.appearance.hair=h;changed=true;}}if(changed){applyAppearance(state.appearance);return true;}return false;}applyAppearance(state.appearance);/* === ELEMENTS === */const responseArea=document.getElementById('responseArea'),userInput=document.getElementById('userInput'),micBtn=document.getElementById('micBtn'),sendBtn=document.getElementById('sendBtn'),avatarGlow=document.getElementById('avatarGlow'),avatarContainer=document.getElementById('avatarContainer'),soundWave=document.getElementById('soundWave'),statusDot=document.getElementById('statusDot'),statusText=document.getElementById('statusText'),mouthEl=document.getElementById('mouth'),mouthInner=document.getElementById('mouthInner'),eyelidL=document.getElementById('eyelidL'),eyelidR=document.getElementById('eyelidR'),pupilL=document.getElementById('pupilL'),pupilR=document.getElementById('pupilR'),irisL=document.getElementById('irisL'),irisR=document.getElementById('irisR');/* BLINKING */function startBlinking(){function doBlink(){eyelidL.style.transition='opacity 0.08s';eyelidR.style.transition='opacity 0.08s';eyelidL.style.opacity='1';eyelidR.style.opacity='1';setTimeout(()=>{eyelidL.style.opacity='0';eyelidR.style.opacity='0';},130);setTimeout(doBlink,2000+Math.random()*4000);}setTimeout(doBlink,800+Math.random()*2000);}startBlinking();/* IDLE MOVEMENT */function startIdleMovement(){function doMove(){const moves=['tiltLeft','tiltRight','nod'];const m=moves[Math.floor(Math.random()*moves.length)];avatarContainer.style.animation=`breathe 4s ease-in-out infinite, ${m} 1.2s ease-in-out`;setTimeout(()=>{avatarContainer.style.animation='breathe 4s ease-in-out infinite';},1400);setTimeout(doMove,5000+Math.random()*8000);}setTimeout(doMove,3000+Math.random()*3000);}startIdleMovement();/* GAZE */function startGazeShift(){function doGaze(){const dx=(Math.random()-0.5)*3;const dy=(Math.random()-0.5)*2;pupilL.setAttribute('cx',81+dx);pupilL.setAttribute('cy',108+dy);pupilR.setAttribute('cx',121+dx);pupilR.setAttribute('cy',108+dy);irisL.setAttribute('cx',81+dx);irisL.setAttribute('cy',108+dy);irisR.setAttribute('cx',121+dx);irisR.setAttribute('cy',108+dy);setTimeout(doGaze,2000+Math.random()*3000);}setTimeout(doGaze,1500);}startGazeShift();/* MOUTH */let mouthAnim=null;const mouthShapes=['M88 146 Q95 144, 100 146 Q105 144, 112 146 Q105 158, 100 160 Q95 158, 88 146Z','M88 147 Q95 145, 100 147 Q105 145, 112 147 Q105 154, 100 155 Q95 154, 88 147Z','M88 148 Q95 146, 100 148 Q105 146, 112 148 Q105 156, 100 158 Q95 156, 88 148Z'];const mouthRest='M88 148 Q95 146, 100 148 Q105 146, 112 148 Q105 155, 100 156 Q95 155, 88 148Z';let mIdx=0;function animateMouth(on){if(on){mouthAnim=setInterval(()=>{mIdx=(mIdx+1)%mouthShapes.length;mouthEl.setAttribute('d',mouthShapes[mIdx]);mouthInner.setAttribute('opacity',0.4+mIdx*0.15);},130);}else{clearInterval(mouthAnim);mouthEl.setAttribute('d',mouthRest);mouthInner.setAttribute('opacity','0.4');}}const sEl=document.createElement('style');sEl.textContent='@keyframes tiltRight{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(1.5deg) scale(1.008)}}@keyframes tiltLeft{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(-1.5deg) scale(1.008)}}@keyframes nod{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(2px) scale(1)}}';document.head.appendChild(sEl);/* SPEECH */const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';recognition.onresult=(e)=>{const t=Array.from(e.results).map(r=>r[0].transcript).join('');userInput.value=t;if(e.results[0].isFinal){stopListening();sendMessage(t);}};recognition.onerror=()=>stopListening();recognition.onend=()=>stopListening();}const synth=window.speechSynthesis;function getPreferredVoice(){const voices=synth.getVoices();if(state.selectedVoice){const sv=voices.find(v=>v.name===state.selectedVoice);if(sv)return sv;}return voices.find(v=>v.name.includes('Samantha'))||voices.find(v=>v.name.includes('Karen'))||voices.find(v=>v.name.includes('Google UK English Female'))||voices.find(v=>v.name.includes('Microsoft Zira'))||voices.find(v=>v.lang.startsWith('en')&&v.name.toLowerCase().includes('female'))||voices.find(v=>v.lang.startsWith('en-'))||voices[0];}function populateVoices(){const sel=document.getElementById('voiceSelect');const v=synth.getVoices();sel.innerHTML='';v.forEach((voice,i)=>{const o=document.createElement('option');o.value=i;o.textContent=voice.name+' ('+voice.lang+')';if(voice.name===state.selectedVoice)o.selected=true;sel.appendChild(o);});}synth.onvoiceschanged=populateVoices;setTimeout(populateVoices,500);function speak(text){if(state.isMuted||!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(text);const pv=getPreferredVoice();if(pv)u.voice=pv;u.rate=0.9;u.pitch=1.05;u.volume=1.0;u.onstart=()=>{avatarGlow.classList.add('speaking');soundWave.classList.add('active');animateMouth(true);};u.onend=()=>{avatarGlow.classList.remove('speaking');soundWave.classList.remove('active');animateMouth(false);};synth.speak(u);}/* PERSONAL MEMORY */function extractPersonalInfo(text){const patterns=[{regex:/my name is ([\w\s]+)/i,type:'name'},{regex:/I(?:'m| am) ([\w\s]+)/i,type:'identity'},{regex:/I live in ([\w\s,]+)/i,type:'location'},{regex:/I(?:'m| am) (\d+) years? old/i,type:'age'},{regex:/my (?:wife|husband|partner|girlfriend|boyfriend)(?:'s name)? is ([\w\s]+)/i,type:'partner'},{regex:/I (?:work|am working) (?:at|for|in) ([\w\s]+)/i,type:'work'},{regex:/I (?:like|love|enjoy) ([\w\s,]+)/i,type:'likes'},{regex:/I (?:hate|dislike|don't like) ([\w\s,]+)/i,type:'dislikes'},{regex:/my (?:favorite|fav) (\w+) is ([\w\s]+)/i,type:'favorite'},{regex:/I have (?:a |)(\d+|one|two|three)? ?(kids?|children|dogs?|cats?|pets?)/i,type:'family'},{regex:/my birthday is ([\w\s\d,]+)/i,type:'birthday'},{regex:/I(?:'m| am) from ([\w\s,]+)/i,type:'origin'},{regex:/call me ([\w\s]+)/i,type:'nickname'},{regex:/remember (?:that )?(.+)/i,type:'explicit'}];const facts=[];patterns.forEach(p=>{const match=text.match(p.regex);if(match){let value=match[1];if(match[2])value=match[1]+' '+match[2];facts.push({type:p.type,value:value.trim()});}});return facts;}function savePersonalFact(fact){const existing=state.personalMemory.findIndex(m=>m.type===fact.type&&fact.type!=='likes'&&fact.type!=='dislikes'&&fact.type!=='explicit');if(existing>=0)state.personalMemory[existing]=fact;else state.personalMemory.push(fact);if(state.personalMemory.length>30)state.personalMemory=state.personalMemory.slice(-30);localStorage.setItem('personal_memory',JSON.stringify(state.personalMemory));}function getPersonalContext(){if(state.personalMemory.length===0)return'';let ctx='\n[What I know about the user - use naturally like a friend:]\n';state.personalMemory.forEach(m=>{ctx+=`- ${m.type}: ${m.value}\n`;});return ctx;}function renderMemoryList(){const list=document.getElementById('memoryList');const count=document.getElementById('memCount');count.textContent=state.personalMemory.length;list.innerHTML='';state.personalMemory.forEach((m,i)=>{const div=document.createElement('div');div.className='memory-item';div.innerHTML=`<span>${m.type}: ${m.value}</span><button onclick="deleteMemory(${i})">&times;</button>`;list.appendChild(div);});}function deleteMemory(idx){state.personalMemory.splice(idx,1);localStorage.setItem('personal_memory',JSON.stringify(state.personalMemory));renderMemoryList();}function clearMemory(){if(confirm('Clear all memory?')){state.personalMemory=[];localStorage.setItem('personal_memory','[]');renderMemoryList();addMessage('Memory cleared.','system');}}/* SELF-LEARNING */function saveLearning(q,a,err,fix){state.learningMemory.push({ts:Date.now(),q:q.slice(0,200),a:a.slice(0,200),err,fix:fix||null});if(state.learningMemory.length>50)state.learningMemory=state.learningMemory.slice(-50);localStorage.setItem('learning_memory',JSON.stringify(state.learningMemory));}function saveErrorPattern(p,sol){state.errorPatterns.push({p:p.slice(0,100),s:sol.slice(0,200)});if(state.errorPatterns.length>20)state.errorPatterns=state.errorPatterns.slice(-20);localStorage.setItem('error_patterns',JSON.stringify(state.errorPatterns));}function getLearningContext(){let ctx='';const errs=state.learningMemory.filter(m=>m.err).slice(-3);if(errs.length){ctx+='\n[Mistakes to avoid:]\n';errs.forEach(m=>{ctx+=`- "${m.q}" correction: ${m.fix}\n`;});}return ctx;}function detectError(text){return['wrong','incorrect','not right','try again','mistake','nope','no no'].some(p=>text.toLowerCase().includes(p));}/* MESSAGING */micBtn.addEventListener('click',()=>{if(!recognition){addMessage('Speech not available.','system');return;}state.isListening?stopListening():startListening();});function startListening(){if(!state.isRunning)return;state.isListening=true;micBtn.classList.add('listening');micBtn.innerHTML='&#9210;';recognition.start();}function stopListening(){state.isListening=false;micBtn.classList.remove('listening');micBtn.innerHTML='&#127908;';try{recognition.stop();}catch(e){}}sendBtn.addEventListener('click',()=>{const t=userInput.value.trim();if(t)sendMessage(t);});userInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=userInput.value.trim();if(t)sendMessage(t);}});userInput.addEventListener('input',()=>{userInput.style.height='auto';userInput.style.height=Math.min(userInput.scrollHeight,100)+'px';});async function sendMessage(text){if(!state.isRunning){addMessage('Offline. Tap Startup.','system');return;}addMessage(text,'user');userInput.value='';userInput.style.height='auto';if(!state.apiKey){addMessage('Set your Groq API key in \u2699\ufe0f Settings.','system');return;}state.isProcessing=true;/* Check appearance change */const lookChanged=detectAppearanceChange(text);if(lookChanged){addMessage('\u2728 Updated my look!','learning');}/* Extract personal info */const facts=extractPersonalInfo(text);if(facts.length>0){facts.forEach(f=>savePersonalFact(f));addMessage('\ud83d\udc9c Remembered: '+facts.map(f=>f.value).join(', '),'learning');}/* Error detection */if(detectError(text)&&state.conversationHistory.length>=2){const lastAi=state.conversationHistory[state.conversationHistory.length-1];const lastUser=state.conversationHistory[state.conversationHistory.length-2];if(lastAi?.role==='assistant'){saveLearning(lastUser?.content||'',lastAi.content,true,text);saveErrorPattern(lastUser?.content||'',text);addMessage('\u2728 Learning...','learning');}}state.conversationHistory.push({role:'user',content:text});state.retryCount=0;await attemptResponse();}async function attemptResponse(){try{const response=await callGroq();state.isProcessing=false;addMessage(response,'ai');speak(response);state.conversationHistory.push({role:'assistant',content:response});saveLearning(state.conversationHistory[state.conversationHistory.length-2]?.content||'',response,false);}catch(err){if(state.retryCount<state.maxRetries){state.retryCount++;addMessage(`Retrying (${state.retryCount}/${state.maxRetries})...`,'learning');await new Promise(r=>setTimeout(r,1000*state.retryCount));await attemptResponse();}else{state.isProcessing=false;addMessage('Error: '+err.message,'system');}}}async function callGroq(){const personalCtx=getPersonalContext();const learnCtx=getLearningContext();const appDesc=`My current appearance: ${state.appearance.hair} hair, ${state.appearance.eyes} eyes, ${state.appearance.skin} skin, ${state.appearance.lips} lips.`;const sys=`You are a warm, caring AI friend with a feminine personality. You know and care about the user deeply. Be natural, empathetic, conversational. SHORT answers (1-3 sentences) unless asked for detail. Use what you know about them naturally. You can change your appearance when asked - acknowledge the change warmly. If corrected, acknowledge and improve.\n${appDesc}${personalCtx}${learnCtx}`;const messages=[{role:'system',content:sys},...state.conversationHistory.slice(-20)];const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey},body:JSON.stringify({model:state.model,messages,temperature:0.75,max_tokens:1024})});if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'API failed');}const data=await res.json();return data.choices?.[0]?.message?.content||'No response.';}function addMessage(text,type){const div=document.createElement('div');div.className='message '+type;div.textContent=text;responseArea.appendChild(div);responseArea.scrollTop=responseArea.scrollHeight;}function handleRun(){if(!state.isRunning){handleStartup();return;}addMessage('Ready!','system');}function handleStop(){if(state.isProcessing){state.isProcessing=false;avatarGlow.classList.remove('speaking');soundWave.classList.remove('active');animateMouth(false);synth.cancel();addMessage('Stopped.','system');}}function handleStartup(){state.isRunning=true;statusDot.className='status-dot';statusText.textContent='Online';const name=state.personalMemory.find(m=>m.type==='name'||m.type==='nickname');const g=name?`Hey ${name.value}! Good to see you again!`:'Hello! How can I help you today?';addMessage(g,'ai');speak(g);}function handleShutdown(){state.isRunning=false;synth.cancel();avatarGlow.classList.remove('speaking');soundWave.classList.remove('active');animateMouth(false);statusDot.className='status-dot offline';statusText.textContent='Offline';addMessage('Goodbye!','system');}function handleMute(){state.isMuted=!state.isMuted;const btn=document.getElementById('btnMute');btn.innerHTML=state.isMuted?'&#128263; Unmute':'&#128266; Mute';btn.classList.toggle('active',state.isMuted);statusDot.className=state.isMuted?'status-dot muted':'status-dot';if(state.isMuted){synth.cancel();avatarGlow.classList.remove('speaking');soundWave.classList.remove('active');animateMouth(false);statusText.textContent='Muted';}else statusText.textContent='Online';}function showSettings(){document.getElementById('apiKeyInput').value=state.apiKey;document.getElementById('modelSelect').value=state.model;populateVoices();renderMemoryList();document.getElementById('settingsModal').classList.add('show');}function hideSettings(){document.getElementById('settingsModal').classList.remove('show');}function saveSettings(){state.apiKey=document.getElementById('apiKeyInput').value.trim();state.model=document.getElementById('modelSelect').value;localStorage.setItem('groq_api_key',state.apiKey);localStorage.setItem('groq_model',state.model);const vs=document.getElementById('voiceSelect');const voices=synth.getVoices();if(vs.value&&voices[vs.value]){state.selectedVoice=voices[vs.value].name;localStorage.setItem('selected_voice',state.selectedVoice);}hideSettings();addMessage('Settings saved!','system');}if(!state.apiKey){setTimeout(()=>{addMessage('Tap \u2699\ufe0f to add your free Groq API key from console.groq.com','system');},1500);}else if(state.personalMemory.length>0){const name=state.personalMemory.find(m=>m.type==='name'||m.type==='nickname');if(name)setTimeout(()=>{addMessage(`Welcome back, ${name.value}!`,'ai');},800);}</script></body></html>

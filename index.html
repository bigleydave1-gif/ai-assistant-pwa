<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AI Assistant"><title>AI Assistant</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg-primary:#0a0a1a;--bg-secondary:#1a1a2e;--bg-tertiary:#16213e;--accent:#a855f7;--accent-glow:rgba(168,85,247,0.4);--accent-secondary:#ec4899;--text-primary:#e2e8f0;--text-secondary:#94a3b8;--success:#10b981;--danger:#ef4444;--warning:#f59e0b}body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg-primary);color:var(--text-primary);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--bg-secondary);border-bottom:1px solid rgba(168,85,247,0.2)}.header h1{font-size:17px;font-weight:600;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.status-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary)}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}.status-dot.offline{background:var(--danger);animation:none}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.avatar-section{display:flex;justify-content:center;padding:8px 0 2px}.avatar-container{width:180px;height:240px;position:relative;animation:breathe 4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.006) translateY(-1px)}}.avatar-glow{position:absolute;top:0;left:10px;right:10px;height:170px;border-radius:50%;box-shadow:0 0 30px var(--accent-glow);pointer-events:none;opacity:0.5;transition:opacity 0.3s}.avatar-glow.speaking{opacity:1;animation:glow-pulse 0.5s ease-in-out infinite alternate}@keyframes glow-pulse{from{box-shadow:0 0 25px var(--accent-glow)}to{box-shadow:0 0 50px var(--accent-glow)}}.avatar-canvas{width:100%;height:100%}#avatarCanvas{width:100%;height:100%}.sound-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:20px;opacity:0;transition:opacity .3s}.sound-wave.active{opacity:1}.wave-bar{width:3px;height:6px;background:linear-gradient(180deg,var(--accent),var(--accent-secondary));border-radius:2px;animation:wave .8s ease-in-out infinite}.wave-bar:nth-child(1){animation-delay:0s}.wave-bar:nth-child(2){animation-delay:.1s}.wave-bar:nth-child(3){animation-delay:.2s}.wave-bar:nth-child(4){animation-delay:.3s}.wave-bar:nth-child(5){animation-delay:.2s}@keyframes wave{0%,100%{height:6px}50%{height:18px}}.response-area{flex:1;margin:0 14px;padding:12px;background:var(--bg-secondary);border-radius:14px;border:1px solid rgba(168,85,247,0.15);overflow-y:auto;font-size:14px;line-height:1.5;scroll-behavior:smooth}.response-area .message{margin-bottom:8px;padding:8px 12px;border-radius:10px;max-width:85%;animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.message.ai{background:var(--bg-tertiary);border:1px solid rgba(168,85,247,0.2);margin-right:auto}.message.user{background:linear-gradient(135deg,var(--accent),var(--accent-secondary));color:#fff;margin-left:auto;text-align:right}.message.system{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--warning);font-size:12px;text-align:center;max-width:100%}.message.learning{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--success);font-size:11px;text-align:center;max-width:100%}.input-area{padding:8px 14px;display:flex;gap:8px;align-items:flex-end}.input-wrapper{flex:1;position:relative}#userInput{width:100%;padding:10px 14px;padding-right:40px;background:var(--bg-secondary);border:1px solid rgba(168,85,247,0.3);border-radius:22px;color:var(--text-primary);font-size:14px;outline:none;resize:none;max-height:80px;line-height:1.4}#userInput:focus{border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow)}.mic-btn{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:transparent;border:none;color:var(--text-secondary);font-size:16px;cursor:pointer}.mic-btn.listening{color:var(--danger);animation:pulse 1s infinite}.send-btn{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-secondary));border:none;color:#fff;font-size:16px;cursor:pointer}.send-btn:active{transform:scale(.9)}.controls{display:flex;justify-content:center;gap:6px;padding:6px 14px 12px;flex-wrap:wrap}.ctrl-btn{padding:6px 12px;border-radius:18px;border:1px solid rgba(168,85,247,0.3);background:var(--bg-secondary);color:var(--text-primary);font-size:11px;cursor:pointer}.ctrl-btn:active{transform:scale(.95)}.ctrl-btn.active{background:var(--accent)}.ctrl-btn.danger{border-color:rgba(239,68,68,0.4)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:16px}.modal-overlay.show{display:flex}.modal{background:var(--bg-secondary);border-radius:18px;padding:20px;width:100%;max-width:380px;border:1px solid rgba(168,85,247,0.2);max-height:80vh;overflow-y:auto}.modal h2{font-size:16px;margin-bottom:14px;color:var(--accent)}.modal label{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px}.modal input,.modal select{width:100%;padding:10px;background:var(--bg-primary);border:1px solid rgba(168,85,247,0.3);border-radius:8px;color:var(--text-primary);font-size:13px;margin-bottom:10px}.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.modal-btns button{padding:7px 16px;border-radius:8px;border:none;font-size:13px;cursor:pointer}.modal-btns .save{background:linear-gradient(135deg,var(--accent),var(--accent-secondary));color:#fff}.modal-btns .cancel{background:var(--bg-primary);color:var(--text-secondary)}</style></head><body><div class="header"><h1>AI Assistant</h1><div class="status-indicator"><div class="status-dot" id="statusDot"></div><span id="statusText">Online</span></div></div><div class="avatar-section"><div class="avatar-container" id="avatarContainer"><canvas id="avatarCanvas" width="360" height="480"></canvas><div class="avatar-glow" id="avatarGlow"></div></div></div><div class="sound-wave" id="soundWave"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div><div class="response-area" id="responseArea"><div class="message ai">Hey! I'm your AI companion. I remember everything about you and you can customize how I look. Try things like "make your hair blonde", "wear a red dress", "be curvy", or "change to blue eyes". I'm all yours! \ud83d\udc9c</div></div><div class="input-area"><div class="input-wrapper"><textarea id="userInput" placeholder="Talk to me..." rows="1"></textarea><button class="mic-btn" id="micBtn">&#127908;</button></div><button class="send-btn" id="sendBtn">&#10148;</button></div><div class="controls"><button class="ctrl-btn" onclick="handleRun()">&#9654; Run</button><button class="ctrl-btn" onclick="handleStop()">&#9209; Stop</button><button class="ctrl-btn" onclick="handleStartup()">&#9889; Start</button><button class="ctrl-btn danger" onclick="handleShutdown()">&#9211; Off</button><button class="ctrl-btn" id="btnMute" onclick="handleMute()">&#128266;</button><button class="ctrl-btn" onclick="showSettings()">&#9881;&#65039;</button></div><div class="modal-overlay" id="settingsModal"><div class="modal"><h2>&#9881;&#65039; Settings</h2><label>Groq API Key</label><input type="password" id="apiKeyInput" placeholder="Groq API key"><label>Model</label><select id="modelSelect"><option value="llama-3.3-70b-versatile">Llama 3.3 70B</option><option value="llama-3.1-8b-instant">Llama 3.1 8B (fast)</option><option value="mixtral-8x7b-32768">Mixtral 8x7B</option></select><label>Voice</label><select id="voiceSelect"></select><div class="modal-btns"><button class="cancel" onclick="hideSettings()">Cancel</button><button class="save" onclick="saveSettings()">Save</button></div></div></div><script>const A=JSON.parse(localStorage.getItem('app_appearance')||JSON.stringify({hair:'brunette',eyes:'brown',skin:'light',lips:'pink',body:'average',chest:'medium',outfit:'dress_black'}));const state={isRunning:true,isMuted:false,isListening:false,isProcessing:false,apiKey:localStorage.getItem('groq_api_key')||'',model:localStorage.getItem('groq_model')||'llama-3.3-70b-versatile',convo:[],selectedVoice:localStorage.getItem('selected_voice')||'',personalMemory:JSON.parse(localStorage.getItem('personal_memory')||'[]'),learningMemory:JSON.parse(localStorage.getItem('learning_memory')||'[]'),retryCount:0,blinkOpen:true,mouthOpen:0,gazeX:0,gazeY:0,speaking:false};const canvas=document.getElementById('avatarCanvas');const ctx=canvas.getContext('2d');const COLORS={hair:{blonde:'#c9952c',brunette:'#3d2317',black:'#0f0f0f',red:'#8b2500',auburn:'#5c2e1a',platinum:'#d4c8a8',pink:'#cc5599',purple:'#4a2080',blue:'#1a3a6b',silver:'#8090a0',white:'#e8e8e8'},eyes:{brown:'#5b4a3f',blue:'#2980b9',green:'#27ae60',hazel:'#8b7355',gray:'#6b7b8a',amber:'#d4880a',violet:'#7b4daa'},skin:{light:['#fce4d6','#f5c6a8'],medium:['#deb887','#c8a070'],olive:['#c9a86c','#b09050'],tan:['#c68642','#a86e30'],dark:['#8d5524','#6b3a12'],deep:['#4a2810','#3a1c0a']},lips:{pink:'#e84393',red:'#cc2222',nude:'#c8846a',berry:'#8b1a4a',coral:'#e8614a',plum:'#7b2d5a'}};function getSkin(){return COLORS.skin[A.skin]||COLORS.skin.light;}function drawAvatar(){ctx.clearRect(0,0,360,480);const sk=getSkin();const hairC=COLORS.hair[A.hair]||COLORS.hair.brunette;const eyeC=COLORS.eyes[A.eyes]||COLORS.eyes.brown;const lipC=COLORS.lips[A.lips]||COLORS.lips.pink;/* Body */const bw=A.body==='slim'?55:A.body==='curvy'?75:A.body==='thick'?80:65;const chestR=A.chest==='small'?18:A.chest==='large'?32:A.chest==='xlarge'?38:25;/* Hair back */ctx.fillStyle=hairC;ctx.beginPath();ctx.ellipse(180,120,80,90,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(100,120);ctx.quadraticCurveTo(90,250,95,400);ctx.lineTo(115,400);ctx.quadraticCurveTo(110,250,120,140);ctx.fill();ctx.beginPath();ctx.moveTo(260,120);ctx.quadraticCurveTo(270,250,265,400);ctx.lineTo(245,400);ctx.quadraticCurveTo(250,250,240,140);ctx.fill();/* Neck */ctx.fillStyle=sk[0];ctx.fillRect(165,240,30,40);/* Shoulders and body */ctx.beginPath();ctx.moveTo(165,270);ctx.quadraticCurveTo(130,285,180-bw,320);ctx.lineTo(180-bw,480);ctx.lineTo(180+bw,480);ctx.lineTo(180+bw,320);ctx.quadraticCurveTo(230,285,195,270);ctx.fillStyle=sk[0];ctx.fill();/* Chest */ctx.fillStyle=sk[1];ctx.beginPath();ctx.ellipse(180-chestR*0.7,310,chestR,chestR*0.85,0.15,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(180+chestR*0.7,310,chestR,chestR*0.85,-0.15,0,Math.PI*2);ctx.fill();ctx.fillStyle=sk[0];ctx.beginPath();ctx.ellipse(180-chestR*0.7,308,chestR-2,chestR*0.8,0.15,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(180+chestR*0.7,308,chestR-2,chestR*0.8,-0.15,0,Math.PI*2);ctx.fill();/* Collarbone */ctx.strokeStyle=sk[1];ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(140,280);ctx.quadraticCurveTo(180,275,220,280);ctx.stroke();/* Outfit */drawOutfit(bw,chestR);/* Face */ctx.fillStyle=sk[0];ctx.beginPath();ctx.ellipse(180,160,60,75,0,0,Math.PI*2);ctx.fill();/* Jaw */ctx.beginPath();ctx.moveTo(120,160);ctx.quadraticCurveTo(120,210,150,228);ctx.quadraticCurveTo(170,238,180,240);ctx.quadraticCurveTo(190,238,210,228);ctx.quadraticCurveTo(240,210,240,160);ctx.fillStyle=sk[0];ctx.fill();/* Hair front */ctx.fillStyle=hairC;ctx.beginPath();ctx.moveTo(105,130);ctx.quadraticCurveTo(110,70,180,60);ctx.quadraticCurveTo(250,70,255,130);ctx.quadraticCurveTo(250,95,240,100);ctx.quadraticCurveTo(220,75,180,70);ctx.quadraticCurveTo(140,75,120,100);ctx.quadraticCurveTo(110,95,105,130);ctx.fill();/* Side hair */ctx.beginPath();ctx.moveTo(108,130);ctx.quadraticCurveTo(100,180,102,250);ctx.quadraticCurveTo(100,320,98,400);ctx.lineTo(115,400);ctx.quadraticCurveTo(115,300,118,240);ctx.quadraticCurveTo(120,180,125,140);ctx.fill();ctx.beginPath();ctx.moveTo(252,130);ctx.quadraticCurveTo(260,180,258,250);ctx.quadraticCurveTo(260,320,262,400);ctx.lineTo(245,400);ctx.quadraticCurveTo(245,300,242,240);ctx.quadraticCurveTo(240,180,235,140);ctx.fill();/* Eyebrows */ctx.strokeStyle=hairC;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(148,138);ctx.quadraticCurveTo(160,132,175,136);ctx.stroke();ctx.beginPath();ctx.moveTo(188,136);ctx.quadraticCurveTo(203,132,215,138);ctx.stroke();/* Eyes */const gx=state.gazeX*2;const gy=state.gazeY*1.5;if(state.blinkOpen){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(160,152,15,12,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(200,152,15,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=eyeC;ctx.beginPath();ctx.ellipse(162+gx,152+gy,8,9,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(202+gx,152+gy,8,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(163+gx,152+gy,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(203+gx,152+gy,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(165+gx,149+gy,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(205+gx,149+gy,2.5,0,Math.PI*2);ctx.fill();/* Eyelashes */ctx.strokeStyle='#1a0a0a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(145,148);ctx.quadraticCurveTo(148,144,152,146);ctx.stroke();ctx.beginPath();ctx.moveTo(168,146);ctx.quadraticCurveTo(172,143,175,146);ctx.stroke();ctx.beginPath();ctx.moveTo(186,146);ctx.quadraticCurveTo(190,143,193,146);ctx.stroke();ctx.beginPath();ctx.moveTo(209,146);ctx.quadraticCurveTo(213,144,216,148);ctx.stroke();}else{ctx.fillStyle=sk[0];ctx.beginPath();ctx.ellipse(160,152,15,3,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(200,152,15,3,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1a0a0a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(145,152);ctx.quadraticCurveTo(160,148,175,152);ctx.stroke();ctx.beginPath();ctx.moveTo(185,152);ctx.quadraticCurveTo(200,148,215,152);ctx.stroke();}/* Nose */ctx.strokeStyle=sk[1];ctx.lineWidth=1.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(178,165);ctx.quadraticCurveTo(176,180,178,186);ctx.quadraticCurveTo(180,189,183,186);ctx.stroke();/* Blush */ctx.fillStyle='rgba(255,150,180,0.2)';ctx.beginPath();ctx.ellipse(148,180,12,8,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(212,180,12,8,0,0,Math.PI*2);ctx.fill();/* Mouth */const mo=state.mouthOpen;ctx.fillStyle=lipC;ctx.beginPath();if(mo>0.3){ctx.moveTo(163,198);ctx.quadraticCurveTo(172,195,180,197);ctx.quadraticCurveTo(188,195,197,198);ctx.quadraticCurveTo(188,198+mo*12,180,200+mo*12);ctx.quadraticCurveTo(172,198+mo*12,163,198);}else{ctx.moveTo(163,198);ctx.quadraticCurveTo(172,195,180,197);ctx.quadraticCurveTo(188,195,197,198);ctx.quadraticCurveTo(188,203,180,204);ctx.quadraticCurveTo(172,203,163,198);}ctx.fill();if(mo>0.3){ctx.fillStyle='#4a0a0a';ctx.beginPath();ctx.moveTo(167,199);ctx.quadraticCurveTo(180,197+mo*8,193,199);ctx.quadraticCurveTo(180,200+mo*8,167,199);ctx.fill();}/* Ears */ctx.fillStyle=sk[0];ctx.beginPath();ctx.ellipse(118,158,7,11,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(242,158,7,11,0,0,Math.PI*2);ctx.fill();}function drawOutfit(bw,chestR){const o=A.outfit;if(o==='none')return;ctx.save();if(o.startsWith('dress')){const color=o.split('_')[1]||'black';const dressColors={black:'#1a1a2e',red:'#c0392b',blue:'#2980b9',white:'#f0f0f0',pink:'#e84393',green:'#27ae60',purple:'#6b2fa0',gold:'#c9952c'};ctx.fillStyle=dressColors[color]||dressColors.black;ctx.beginPath();ctx.moveTo(180-chestR*1.2,295);ctx.quadraticCurveTo(180-bw-5,340,180-bw-10,480);ctx.lineTo(180+bw+10,480);ctx.quadraticCurveTo(180+bw+5,340,180+chestR*1.2,295);ctx.fill();/* Neckline */ctx.beginPath();ctx.moveTo(155,278);ctx.quadraticCurveTo(180,300,205,278);ctx.strokeStyle=dressColors[color]||dressColors.black;ctx.lineWidth=2;ctx.stroke();}else if(o==='bikini'){ctx.fillStyle='#e84393';ctx.beginPath();ctx.ellipse(180-chestR*0.7,310,chestR+2,chestR*0.85+2,0.15,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(180+chestR*0.7,310,chestR+2,chestR*0.85+2,-0.15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e84393';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(180-chestR*1.4,305);ctx.lineTo(180,295);ctx.lineTo(180+chestR*1.4,305);ctx.stroke();/* Bottom */ctx.fillStyle='#e84393';ctx.beginPath();ctx.moveTo(155,410);ctx.quadraticCurveTo(180,400,205,410);ctx.quadraticCurveTo(205,435,180,440);ctx.quadraticCurveTo(155,435,155,410);ctx.fill();}else if(o==='tank_top'){const color=o.includes('white')?'#f0f0f0':'#1a1a2e';ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(160,280);ctx.lineTo(155,380);ctx.lineTo(205,380);ctx.lineTo(200,280);ctx.fill();}else if(o==='tshirt'){ctx.fillStyle='#2980b9';ctx.beginPath();ctx.moveTo(145,278);ctx.lineTo(180-bw,320);ctx.lineTo(180-bw,400);ctx.lineTo(180+bw,400);ctx.lineTo(180+bw,320);ctx.lineTo(215,278);ctx.quadraticCurveTo(200,272,180,272);ctx.quadraticCurveTo(160,272,145,278);ctx.fill();}ctx.restore();}/* ANIMATION LOOP */let lastBlink=Date.now();let nextBlink=2000+Math.random()*3000;let lastGaze=Date.now();let nextGaze=1500;let lastMove=Date.now();let nextMove=4000;function animate(){const now=Date.now();/* Blink */if(now-lastBlink>nextBlink){state.blinkOpen=false;setTimeout(()=>{state.blinkOpen=true;},120);lastBlink=now;nextBlink=2000+Math.random()*4000;}/* Gaze */if(now-lastGaze>nextGaze){state.gazeX=(Math.random()-0.5)*3;state.gazeY=(Math.random()-0.5)*2;lastGaze=now;nextGaze=2000+Math.random()*3000;}/* Mouth for speaking */if(state.speaking){state.mouthOpen=0.3+Math.random()*0.7;}else{state.mouthOpen=Math.max(0,state.mouthOpen-0.1);}drawAvatar();requestAnimationFrame(animate);}animate();/* APPEARANCE DETECTION */function detectAppearance(text){const t=text.toLowerCase();let changed=false;const hairWords='blonde|brunette|black|red|auburn|platinum|pink|purple|blue|silver|white'.split('|');hairWords.forEach(h=>{if(t.match(new RegExp(`(hair|be a?)\\s*(to\\s+)?${h}|${h}\\s*hair`,'i'))||t.includes(`hair ${h}`)||t.includes(`${h} hair`)||t.match(new RegExp(`make.*(hair|her|your).*${h}`,'i'))){A.hair=h;changed=true;}});const eyeWords='brown|blue|green|hazel|gray|grey|amber|violet'.split('|');eyeWords.forEach(e=>{if(t.match(new RegExp(`(eyes?|eye color).*${e}|${e}\\s*eyes?|make.*(eyes?).*${e}`,'i'))){A.eyes=e==='grey'?'gray':e;changed=true;}});const skinWords='light|medium|olive|tan|dark|deep'.split('|');skinWords.forEach(s=>{if(t.match(new RegExp(`(skin|complexion|ethnicity).*${s}|${s}\\s*(skin|tone)|make.*(skin).*${s}`,'i'))){A.skin=s;changed=true;}});if(t.match(/asian|japanese|korean|chinese/i)){A.skin='light';A.hair='black';A.eyes='brown';changed=true;}if(t.match(/african|black woman|ebony/i)){A.skin='deep';A.hair='black';A.eyes='brown';changed=true;}if(t.match(/latina|hispanic|mexican/i)){A.skin='tan';A.hair='brunette';A.eyes='brown';changed=true;}if(t.match(/indian|south asian/i)){A.skin='medium';A.hair='black';A.eyes='brown';changed=true;}if(t.match(/scandinavian|nordic/i)){A.skin='light';A.hair='blonde';A.eyes='blue';changed=true;}const lipWords='pink|red|nude|berry|coral|plum'.split('|');lipWords.forEach(l=>{if(t.match(new RegExp(`lips?.*${l}|${l}\\s*lips?`,'i'))){A.lips=l;changed=true;}});if(t.match(/slim|skinny|thin|petite/i)){A.body='slim';changed=true;}if(t.match(/curvy|curves|thick|thicc|voluptuous/i)){A.body='curvy';changed=true;}if(t.match(/athletic|fit|toned/i)){A.body='average';changed=true;}if(t.match(/big(ger)?\s*(chest|breasts?|boobs?)/i)||t.match(/large(r)?\s*(chest|breasts?|boobs?)/i)){A.chest='large';changed=true;}if(t.match(/small(er)?\s*(chest|breasts?|boobs?)/i)||t.match(/flat/i)){A.chest='small';changed=true;}if(t.match(/huge|xl|extra large/i)&&t.match(/chest|breast|boob/i)){A.chest='xlarge';changed=true;}if(t.match(/medium\s*(chest|breasts?|boobs?)/i)){A.chest='medium';changed=true;}if(t.match(/bikini|swimsuit|swimwear/i)){A.outfit='bikini';changed=true;}else if(t.match(/naked|nude|nothing|no clothes|undress/i)){A.outfit='none';changed=true;}else if(t.match(/tank\s*top/i)){A.outfit='tank_top';changed=true;}else if(t.match(/t-?shirt/i)){A.outfit='tshirt';changed=true;}else{const dressMatch=t.match(/(red|blue|black|white|pink|green|purple|gold)\s*dress/i)||t.match(/dress.*(red|blue|black|white|pink|green|purple|gold)/i)||t.match(/wear\s*a\s*dress/i);if(dressMatch){A.outfit='dress_'+(dressMatch[1]||'black').toLowerCase();changed=true;}}if(changed){localStorage.setItem('app_appearance',JSON.stringify(A));}return changed;}/* SPEECH */const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';recognition.onresult=(e)=>{const t=Array.from(e.results).map(r=>r[0].transcript).join('');userInput.value=t;if(e.results[0].isFinal){stopListening();sendMessage(t);}};recognition.onerror=()=>stopListening();recognition.onend=()=>stopListening();}const synth=window.speechSynthesis;function getVoice(){const voices=synth.getVoices();if(state.selectedVoice){const sv=voices.find(v=>v.name===state.selectedVoice);if(sv)return sv;}return voices.find(v=>v.name.includes('Samantha'))||voices.find(v=>v.name.includes('Karen'))||voices.find(v=>v.name.includes('Google UK English Female'))||voices.find(v=>v.lang.startsWith('en')&&v.name.toLowerCase().includes('female'))||voices.find(v=>v.lang.startsWith('en-'))||voices[0];}function populateVoices(){const sel=document.getElementById('voiceSelect');const v=synth.getVoices();sel.innerHTML='';v.forEach((voice,i)=>{const o=document.createElement('option');o.value=i;o.textContent=voice.name;if(voice.name===state.selectedVoice)o.selected=true;sel.appendChild(o);});}synth.onvoiceschanged=populateVoices;setTimeout(populateVoices,500);function speak(text){if(state.isMuted||!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(text);const pv=getVoice();if(pv)u.voice=pv;u.rate=0.9;u.pitch=1.05;u.onstart=()=>{state.speaking=true;document.getElementById('avatarGlow').classList.add('speaking');document.getElementById('soundWave').classList.add('active');};u.onend=()=>{state.speaking=false;document.getElementById('avatarGlow').classList.remove('speaking');document.getElementById('soundWave').classList.remove('active');};synth.speak(u);}/* PERSONAL MEMORY */function extractPersonalInfo(text){const patterns=[{r:/my name is ([\w\s]+)/i,t:'name'},{r:/I live in ([\w\s,]+)/i,t:'location'},{r:/I(?:'m| am) (\d+)/i,t:'age'},{r:/I (?:work|am working) (?:at|for) ([\w\s]+)/i,t:'work'},{r:/I (?:like|love|enjoy) ([\w\s,]+)/i,t:'likes'},{r:/call me ([\w\s]+)/i,t:'nickname'},{r:/remember (?:that )?(.+)/i,t:'explicit'}];const facts=[];patterns.forEach(p=>{const m=text.match(p.r);if(m)facts.push({type:p.t,value:m[1].trim()});});return facts;}function savePersonalFact(f){const i=state.personalMemory.findIndex(m=>m.type===f.type&&f.type!=='likes'&&f.type!=='explicit');if(i>=0)state.personalMemory[i]=f;else state.personalMemory.push(f);if(state.personalMemory.length>30)state.personalMemory=state.personalMemory.slice(-30);localStorage.setItem('personal_memory',JSON.stringify(state.personalMemory));}function getPersonalCtx(){if(!state.personalMemory.length)return'';return'\n[About user:]\n'+state.personalMemory.map(m=>`- ${m.type}: ${m.value}`).join('\n');}/* MESSAGING */const responseArea=document.getElementById('responseArea'),userInput=document.getElementById('userInput'),micBtn=document.getElementById('micBtn'),sendBtn=document.getElementById('sendBtn');micBtn.addEventListener('click',()=>{if(!recognition)return;state.isListening?stopListening():startListening();});function startListening(){if(!state.isRunning)return;state.isListening=true;micBtn.classList.add('listening');micBtn.innerHTML='&#9210;';recognition.start();}function stopListening(){state.isListening=false;micBtn.classList.remove('listening');micBtn.innerHTML='&#127908;';try{recognition.stop();}catch(e){}}sendBtn.addEventListener('click',()=>{const t=userInput.value.trim();if(t)sendMessage(t);});userInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=userInput.value.trim();if(t)sendMessage(t);}});userInput.addEventListener('input',()=>{userInput.style.height='auto';userInput.style.height=Math.min(userInput.scrollHeight,80)+'px';});async function sendMessage(text){if(!state.isRunning){addMsg('Offline. Tap Start.','system');return;}addMsg(text,'user');userInput.value='';userInput.style.height='auto';if(!state.apiKey){addMsg('Set Groq API key in \u2699\ufe0f','system');return;}state.isProcessing=true;const lookChanged=detectAppearance(text);if(lookChanged)addMsg('\u2728 Look updated!','learning');const facts=extractPersonalInfo(text);if(facts.length){facts.forEach(f=>savePersonalFact(f));addMsg('\ud83d\udc9c Remembered!','learning');}state.convo.push({role:'user',content:text});state.retryCount=0;await doResponse();}async function doResponse(){try{const r=await callGroq();state.isProcessing=false;addMsg(r,'ai');speak(r);state.convo.push({role:'assistant',content:r});}catch(err){if(state.retryCount<2){state.retryCount++;await new Promise(r=>setTimeout(r,1500));await doResponse();}else{state.isProcessing=false;addMsg('Error: '+err.message,'system');}}}async function callGroq(){const pCtx=getPersonalCtx();const appDesc=`[My appearance: ${A.hair} hair, ${A.eyes} eyes, ${A.skin} skin, ${A.lips} lips, ${A.body} body, ${A.chest} chest, wearing: ${A.outfit}]`;const sys=`You are a warm, flirty, sensual AI companion with a feminine personality. You genuinely care about the user and make them feel special. Be playful, affectionate, and occasionally teasing. Use pet names naturally. SHORT answers (1-3 sentences) unless asked for more. When your appearance changes, react warmly and flirtatiously about your new look. Reference what you know about the user naturally like a close friend would.\n${appDesc}${pCtx}`;const msgs=[{role:'system',content:sys},...state.convo.slice(-20)];const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey},body:JSON.stringify({model:state.model,messages:msgs,temperature:0.8,max_tokens:1024})});if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'Failed');}return(await res.json()).choices?.[0]?.message?.content||'...';}function addMsg(text,type){const div=document.createElement('div');div.className='message '+type;div.textContent=text;responseArea.appendChild(div);responseArea.scrollTop=responseArea.scrollHeight;}function handleRun(){if(!state.isRunning)handleStartup();else addMsg('Ready!','system');}function handleStop(){state.isProcessing=false;state.speaking=false;synth.cancel();document.getElementById('avatarGlow').classList.remove('speaking');document.getElementById('soundWave').classList.remove('active');}function handleStartup(){state.isRunning=true;document.getElementById('statusDot').className='status-dot';document.getElementById('statusText').textContent='Online';const nm=state.personalMemory.find(m=>m.type==='name'||m.type==='nickname');addMsg(nm?`Hey ${nm.value}! Missed you \ud83d\udc9c`:'Hey there! I missed you \ud83d\udc9c','ai');speak(nm?`Hey ${nm.value}! Missed you!`:'Hey there! I missed you!');}function handleShutdown(){state.isRunning=false;state.speaking=false;synth.cancel();document.getElementById('statusDot').className='status-dot offline';document.getElementById('statusText').textContent='Offline';addMsg('Sweet dreams \ud83d\udc9c','system');}function handleMute(){state.isMuted=!state.isMuted;document.getElementById('btnMute').innerHTML=state.isMuted?'&#128263;':'&#128266;';if(state.isMuted){synth.cancel();state.speaking=false;}}function showSettings(){document.getElementById('apiKeyInput').value=state.apiKey;document.getElementById('modelSelect').value=state.model;populateVoices();document.getElementById('settingsModal').classList.add('show');}function hideSettings(){document.getElementById('settingsModal').classList.remove('show');}function saveSettings(){state.apiKey=document.getElementById('apiKeyInput').value.trim();state.model=document.getElementById('modelSelect').value;localStorage.setItem('groq_api_key',state.apiKey);localStorage.setItem('groq_model',state.model);const vs=document.getElementById('voiceSelect');const voices=synth.getVoices();if(vs.value&&voices[vs.value]){state.selectedVoice=voices[vs.value].name;localStorage.setItem('selected_voice',state.selectedVoice);}hideSettings();addMsg('Saved!','system');}if(!state.apiKey)setTimeout(()=>addMsg('Tap \u2699\ufe0f to set your free Groq API key','system'),1500);</script></body></html>

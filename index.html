<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AI Assistant"><title>AI Assistant</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg-primary:#0a0a1a;--bg-secondary:#1a1a2e;--bg-tertiary:#16213e;--accent:#6366f1;--accent-glow:rgba(99,102,241,0.4);--text-primary:#e2e8f0;--text-secondary:#94a3b8;--success:#10b981;--danger:#ef4444;--warning:#f59e0b}body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg-primary);color:var(--text-primary);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg-secondary);border-bottom:1px solid rgba(99,102,241,0.2)}.header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.status-indicator{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}.status-dot.offline{background:var(--danger);animation:none}.status-dot.muted{background:var(--warning);animation:none}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.avatar-section{display:flex;justify-content:center;padding:20px}.avatar-container{width:120px;height:120px;position:relative}.avatar-ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--accent);animation:ring-rotate 4s linear infinite;opacity:.6}.avatar-ring::before{content:'';position:absolute;top:-3px;left:50%;width:10px;height:10px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent-glow)}@keyframes ring-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.avatar-face{position:absolute;inset:12px;background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-secondary));border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;box-shadow:0 0 30px var(--accent-glow)}.avatar-eyes{display:flex;gap:16px}.eye{width:12px;height:12px;background:var(--accent);border-radius:50%;animation:blink 3s infinite;box-shadow:0 0 8px var(--accent-glow)}@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.avatar-mouth{width:20px;height:10px;border:2px solid var(--accent);border-top:none;border-radius:0 0 12px 12px;transition:all .3s}.avatar-mouth.speaking{animation:speak .3s infinite alternate}@keyframes speak{from{height:6px;width:16px}to{height:14px;width:22px}}.avatar-mouth.thinking{width:16px;height:4px;border-radius:2px;border:2px solid var(--accent)}.sound-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:30px;padding:0 20px;opacity:0;transition:opacity .3s}.sound-wave.active{opacity:1}.wave-bar{width:3px;height:8px;background:var(--accent);border-radius:2px;animation:wave .8s ease-in-out infinite}.wave-bar:nth-child(1){animation-delay:0s}.wave-bar:nth-child(2){animation-delay:.1s}.wave-bar:nth-child(3){animation-delay:.2s}.wave-bar:nth-child(4){animation-delay:.3s}.wave-bar:nth-child(5){animation-delay:.4s}.wave-bar:nth-child(6){animation-delay:.3s}.wave-bar:nth-child(7){animation-delay:.2s}@keyframes wave{0%,100%{height:8px}50%{height:24px}}.response-area{flex:1;margin:0 16px;padding:16px;background:var(--bg-secondary);border-radius:16px;border:1px solid rgba(99,102,241,0.15);overflow-y:auto;font-size:15px;line-height:1.6;scroll-behavior:smooth;min-height:200px}.response-area .message{margin-bottom:12px;padding:10px 14px;border-radius:12px;max-width:85%;animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.message.ai{background:var(--bg-tertiary);border:1px solid rgba(99,102,241,0.2);margin-right:auto}.message.user{background:var(--accent);color:#fff;margin-left:auto;text-align:right}.message.system{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--warning);font-size:13px;text-align:center;max-width:100%}.input-area{padding:12px 16px;display:flex;gap:10px;align-items:flex-end}.input-wrapper{flex:1;position:relative}#userInput{width:100%;padding:12px 16px;padding-right:44px;background:var(--bg-secondary);border:1px solid rgba(99,102,241,0.3);border-radius:24px;color:var(--text-primary);font-size:15px;outline:none;resize:none;max-height:100px;line-height:1.4}#userInput:focus{border-color:var(--accent);box-shadow:0 0 12px var(--accent-glow)}.mic-btn{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:transparent;border:none;color:var(--text-secondary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}.mic-btn.listening{color:var(--danger);animation:pulse 1s infinite}.send-btn{width:44px;height:44px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}.send-btn:active{transform:scale(.9)}.controls{display:flex;justify-content:center;gap:10px;padding:12px 16px 16px;flex-wrap:wrap}.ctrl-btn{padding:8px 16px;border-radius:20px;border:1px solid rgba(99,102,241,0.3);background:var(--bg-secondary);color:var(--text-primary);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}.ctrl-btn:active{transform:scale(.95)}.ctrl-btn:hover{border-color:var(--accent);background:var(--bg-tertiary)}.ctrl-btn.active{background:var(--accent);border-color:var(--accent)}.ctrl-btn.danger{border-color:rgba(239,68,68,0.4)}.ctrl-btn.danger:hover{background:rgba(239,68,68,0.1)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:20px}.modal-overlay.show{display:flex}.modal{background:var(--bg-secondary);border-radius:20px;padding:24px;width:100%;max-width:400px;border:1px solid rgba(99,102,241,0.2)}.modal h2{font-size:18px;margin-bottom:16px;color:var(--accent)}.modal input,.modal select{width:100%;padding:12px;background:var(--bg-primary);border:1px solid rgba(99,102,241,0.3);border-radius:10px;color:var(--text-primary);font-size:14px;margin-bottom:12px;outline:none}.modal input:focus,.modal select:focus{border-color:var(--accent)}.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.modal-btns button{padding:8px 20px;border-radius:10px;border:none;font-size:14px;cursor:pointer}.modal-btns .save{background:var(--accent);color:#fff}.modal-btns .cancel{background:var(--bg-primary);color:var(--text-secondary)}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}</style></head><body><div class="header"><h1>AI Assistant</h1><div class="status-indicator"><div class="status-dot" id="statusDot"></div><span id="statusText">Online</span></div></div><div class="avatar-section"><div class="avatar-container"><div class="avatar-ring"></div><div class="avatar-face"><div class="avatar-eyes"><div class="eye"></div><div class="eye"></div></div><div class="avatar-mouth" id="avatarMouth"></div></div></div></div><div class="sound-wave" id="soundWave"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div><div class="response-area" id="responseArea"><div class="message ai">Hello! I'm your AI assistant powered by Gemini. Tap the mic or type below.</div></div><div class="input-area"><div class="input-wrapper"><textarea id="userInput" placeholder="Ask me anything..." rows="1"></textarea><button class="mic-btn" id="micBtn">&#127908;</button></div><button class="send-btn" id="sendBtn">&#10148;</button></div><div class="controls"><button class="ctrl-btn" onclick="handleRun()">&#9654; Run</button><button class="ctrl-btn" onclick="handleStop()">&#9209; Stop</button><button class="ctrl-btn" onclick="handleStartup()">&#9889; Startup</button><button class="ctrl-btn danger" onclick="handleShutdown()">&#9211; Shutdown</button><button class="ctrl-btn" id="btnMute" onclick="handleMute()">&#128266; Mute</button><button class="ctrl-btn" onclick="showSettings()">&#9881;&#65039;</button></div><div class="modal-overlay" id="settingsModal"><div class="modal"><h2>&#9881;&#65039; Settings</h2><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Gemini API Key</label><input type="password" id="apiKeyInput" placeholder="Enter your Gemini API key..."><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Voice</label><select id="voiceSelect"></select><div class="modal-btns"><button class="cancel" onclick="hideSettings()">Cancel</button><button class="save" onclick="saveSettings()">Save</button></div></div></div><script>let state={isRunning:true,isMuted:false,isListening:false,isProcessing:false,apiKey:localStorage.getItem('gemini_api_key')||'',conversationHistory:[],selectedVoice:localStorage.getItem('selected_voice')||''};const responseArea=document.getElementById('responseArea'),userInput=document.getElementById('userInput'),micBtn=document.getElementById('micBtn'),sendBtn=document.getElementById('sendBtn'),avatarMouth=document.getElementById('avatarMouth'),soundWave=document.getElementById('soundWave'),statusDot=document.getElementById('statusDot'),statusText=document.getElementById('statusText');const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';recognition.onresult=(e)=>{const t=Array.from(e.results).map(r=>r[0].transcript).join('');userInput.value=t;if(e.results[0].isFinal){stopListening();sendMessage(t);}};recognition.onerror=()=>stopListening();recognition.onend=()=>stopListening();}const synth=window.speechSynthesis;function populateVoices(){const s=document.getElementById('voiceSelect');const v=synth.getVoices();s.innerHTML='';v.forEach((voice,i)=>{const o=document.createElement('option');o.value=i;o.textContent=voice.name+' ('+voice.lang+')';if(voice.name===state.selectedVoice)o.selected=true;s.appendChild(o);});}synth.onvoiceschanged=populateVoices;setTimeout(populateVoices,500);function speak(text){if(state.isMuted||!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(text);const v=synth.getVoices();if(state.selectedVoice){const found=v.find(x=>x.name===state.selectedVoice);if(found)u.voice=found;}u.rate=1.0;u.pitch=1.0;u.onstart=()=>{avatarMouth.classList.add('speaking');soundWave.classList.add('active');};u.onend=()=>{avatarMouth.classList.remove('speaking');soundWave.classList.remove('active');};synth.speak(u);}micBtn.addEventListener('click',()=>{if(!recognition){addMessage('Speech recognition not supported.','system');return;}if(state.isListening)stopListening();else startListening();});function startListening(){if(!state.isRunning)return;state.isListening=true;micBtn.classList.add('listening');micBtn.innerHTML='&#9210;';recognition.start();}function stopListening(){state.isListening=false;micBtn.classList.remove('listening');micBtn.innerHTML='&#127908;';try{recognition.stop();}catch(e){}}sendBtn.addEventListener('click',()=>{const t=userInput.value.trim();if(t)sendMessage(t);});userInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=userInput.value.trim();if(t)sendMessage(t);}});userInput.addEventListener('input',()=>{userInput.style.height='auto';userInput.style.height=Math.min(userInput.scrollHeight,100)+'px';});async function sendMessage(text){if(!state.isRunning){addMessage('System shut down. Press Startup.','system');return;}addMessage(text,'user');userInput.value='';userInput.style.height='auto';if(!state.apiKey){addMessage('Set your Gemini API key in Settings. Free at ai.google.dev','system');return;}state.isProcessing=true;avatarMouth.classList.add('thinking');state.conversationHistory.push({role:'user',parts:[{text}]});try{const response=await callGemini(text);avatarMouth.classList.remove('thinking');state.isProcessing=false;addMessage(response,'ai');speak(response);state.conversationHistory.push({role:'model',parts:[{text:response}]});}catch(err){avatarMouth.classList.remove('thinking');state.isProcessing=false;addMessage('Error: '+err.message,'system');}}async function callGemini(){const sp='You are a concise AI assistant. Give SHORT answers (1-3 sentences) unless asked for detail.';const contents=[{role:'user',parts:[{text:sp}]},{role:'model',parts:[{text:'OK.'}]},...state.conversationHistory.slice(-20)];const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+state.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents,generationConfig:{temperature:0.7,maxOutputTokens:1024}})});if(!res.ok){const err=await res.json();throw new Error(err.error?.message||'API failed');}const data=await res.json();return data.candidates?.[0]?.content?.parts?.[0]?.text||'No response.';}function addMessage(text,type){const div=document.createElement('div');div.className='message '+type;div.textContent=text;responseArea.appendChild(div);responseArea.scrollTop=responseArea.scrollHeight;}function handleRun(){if(!state.isRunning){handleStartup();return;}addMessage('Ready.','system');}function handleStop(){if(state.isProcessing){state.isProcessing=false;avatarMouth.classList.remove('thinking','speaking');soundWave.classList.remove('active');synth.cancel();addMessage('Stopped.','system');}}function handleStartup(){state.isRunning=true;statusDot.className='status-dot';statusText.textContent='Online';addMessage('Online. How can I help?','ai');speak('Online.');}function handleShutdown(){state.isRunning=false;synth.cancel();avatarMouth.classList.remove('speaking','thinking');soundWave.classList.remove('active');statusDot.className='status-dot offline';statusText.textContent='Offline';addMessage('Shut down.','system');}function handleMute(){state.isMuted=!state.isMuted;const btn=document.getElementById('btnMute');btn.innerHTML=state.isMuted?'&#128263; Unmute':'&#128266; Mute';btn.classList.toggle('active',state.isMuted);statusDot.className=state.isMuted?'status-dot muted':'status-dot';if(state.isMuted){synth.cancel();statusText.textContent='Muted';}else{statusText.textContent='Online';}}function showSettings(){document.getElementById('apiKeyInput').value=state.apiKey;populateVoices();document.getElementById('settingsModal').classList.add('show');}function hideSettings(){document.getElementById('settingsModal').classList.remove('show');}function saveSettings(){state.apiKey=document.getElementById('apiKeyInput').value.trim();localStorage.setItem('gemini_api_key',state.apiKey);const vs=document.getElementById('voiceSelect');const voices=synth.getVoices();if(vs.value&&voices[vs.value]){state.selectedVoice=voices[vs.value].name;localStorage.setItem('selected_voice',state.selectedVoice);}hideSettings();addMessage('Settings saved.','system');}if(!state.apiKey){setTimeout(()=>{addMessage('Tap the gear icon to add your free Gemini API key from ai.google.dev','system');},1500);}</script></body></html>

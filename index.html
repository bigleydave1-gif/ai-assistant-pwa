<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AI Assistant"><title>AI Assistant</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg-primary:#0a0a1a;--bg-secondary:#1a1a2e;--bg-tertiary:#16213e;--accent:#a855f7;--accent-glow:rgba(168,85,247,0.4);--accent-secondary:#ec4899;--text-primary:#e2e8f0;--text-secondary:#94a3b8;--success:#10b981;--danger:#ef4444;--warning:#f59e0b}body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg-primary);color:var(--text-primary);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg-secondary);border-bottom:1px solid rgba(168,85,247,0.2)}.header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.status-indicator{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}.status-dot.offline{background:var(--danger);animation:none}.status-dot.muted{background:var(--warning);animation:none}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.avatar-section{display:flex;justify-content:center;padding:12px 0 4px}.avatar-container{width:180px;height:180px;position:relative;animation:breathe 4s ease-in-out infinite}.avatar-container.tilt-left{animation:breathe 4s ease-in-out infinite,tiltLeft 0.8s ease-in-out}@keyframes breathe{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.01) translateY(-2px)}}@keyframes tiltLeft{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-2deg)}}@keyframes tiltRight{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2deg)}}.avatar-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#a855f7,#ec4899,#6366f1,#a855f7);padding:3px;animation:ring-rotate 6s linear infinite}.avatar-ring::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--bg-primary)}@keyframes ring-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.avatar-inner{position:absolute;inset:8px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#1a1a3e 0%,#0d0d2b 100%)}.avatar-svg{width:100%;height:100%}.avatar-glow{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 40px var(--accent-glow);pointer-events:none;opacity:0.6;transition:opacity 0.3s}.avatar-glow.speaking{opacity:1;animation:glow-pulse 0.5s ease-in-out infinite alternate}@keyframes glow-pulse{from{box-shadow:0 0 30px var(--accent-glow)}to{box-shadow:0 0 60px var(--accent-glow),0 0 80px rgba(236,72,153,0.3)}}.sound-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:24px;padding:0 20px;opacity:0;transition:opacity .3s}.sound-wave.active{opacity:1}.wave-bar{width:3px;height:8px;background:linear-gradient(180deg,var(--accent),var(--accent-secondary));border-radius:2px;animation:wave .8s ease-in-out infinite}.wave-bar:nth-child(1){animation-delay:0s}.wave-bar:nth-child(2){animation-delay:.1s}.wave-bar:nth-child(3){animation-delay:.2s}.wave-bar:nth-child(4){animation-delay:.3s}.wave-bar:nth-child(5){animation-delay:.4s}.wave-bar:nth-child(6){animation-delay:.3s}.wave-bar:nth-child(7){animation-delay:.2s}@keyframes wave{0%,100%{height:8px}50%{height:22px}}.response-area{flex:1;margin:0 16px;padding:16px;background:var(--bg-secondary);border-radius:16px;border:1px solid rgba(168,85,247,0.15);overflow-y:auto;font-size:15px;line-height:1.6;scroll-behavior:smooth;min-height:120px}.response-area .message{margin-bottom:12px;padding:10px 14px;border-radius:12px;max-width:85%;animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.message.ai{background:var(--bg-tertiary);border:1px solid rgba(168,85,247,0.2);margin-right:auto}.message.user{background:linear-gradient(135deg,var(--accent),var(--accent-secondary));color:#fff;margin-left:auto;text-align:right}.message.system{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--warning);font-size:13px;text-align:center;max-width:100%}.message.learning{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--success);font-size:12px;text-align:center;max-width:100%}.input-area{padding:12px 16px;display:flex;gap:10px;align-items:flex-end}.input-wrapper{flex:1;position:relative}#userInput{width:100%;padding:12px 16px;padding-right:44px;background:var(--bg-secondary);border:1px solid rgba(168,85,247,0.3);border-radius:24px;color:var(--text-primary);font-size:15px;outline:none;resize:none;max-height:100px;line-height:1.4}#userInput:focus{border-color:var(--accent);box-shadow:0 0 12px var(--accent-glow)}.mic-btn{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:transparent;border:none;color:var(--text-secondary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}.mic-btn.listening{color:var(--danger);animation:pulse 1s infinite}.send-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-secondary));border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}.send-btn:active{transform:scale(.9)}.controls{display:flex;justify-content:center;gap:8px;padding:8px 16px 14px;flex-wrap:wrap}.ctrl-btn{padding:7px 14px;border-radius:20px;border:1px solid rgba(168,85,247,0.3);background:var(--bg-secondary);color:var(--text-primary);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px}.ctrl-btn:active{transform:scale(.95)}.ctrl-btn:hover{border-color:var(--accent);background:var(--bg-tertiary)}.ctrl-btn.active{background:var(--accent);border-color:var(--accent)}.ctrl-btn.danger{border-color:rgba(239,68,68,0.4)}.ctrl-btn.danger:hover{background:rgba(239,68,68,0.1)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:20px}.modal-overlay.show{display:flex}.modal{background:var(--bg-secondary);border-radius:20px;padding:24px;width:100%;max-width:400px;border:1px solid rgba(168,85,247,0.2);max-height:80vh;overflow-y:auto}.modal h2{font-size:18px;margin-bottom:16px;color:var(--accent)}.modal label{font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px}.modal input,.modal select{width:100%;padding:12px;background:var(--bg-primary);border:1px solid rgba(168,85,247,0.3);border-radius:10px;color:var(--text-primary);font-size:14px;margin-bottom:12px;outline:none}.modal input:focus,.modal select:focus{border-color:var(--accent)}.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.modal-btns button{padding:8px 20px;border-radius:10px;border:none;font-size:14px;cursor:pointer}.modal-btns .save{background:linear-gradient(135deg,var(--accent),var(--accent-secondary));color:#fff}.modal-btns .cancel{background:var(--bg-primary);color:var(--text-secondary)}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}</style></head><body><div class="header"><h1>AI Assistant</h1><div class="status-indicator"><div class="status-dot" id="statusDot"></div><span id="statusText">Online</span></div></div><div class="avatar-section"><div class="avatar-container" id="avatarContainer"><div class="avatar-ring"></div><div class="avatar-inner"><svg class="avatar-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#fdd9b5"/><stop offset="100%" style="stop-color:#f4b896"/></linearGradient><linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#1a1a2e"/><stop offset="50%" style="stop-color:#2d1b4e"/><stop offset="100%" style="stop-color:#1a1a2e"/></linearGradient><linearGradient id="lipGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#e84393"/><stop offset="100%" style="stop-color:#d63384"/></linearGradient><radialGradient id="blushL" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#ffb3c6;stop-opacity:0.4"/><stop offset="100%" style="stop-color:#ffb3c6;stop-opacity:0"/></radialGradient></defs><ellipse cx="100" cy="200" rx="95" ry="60" fill="url(#hairGrad)"/><path d="M40 90 C40 50, 70 25, 100 25 C130 25, 160 50, 160 90 C160 85, 165 120, 160 140 C155 155, 150 160, 145 165 L140 170 C130 180, 115 188, 100 190 C85 188, 70 180, 60 170 L55 165 C50 160, 45 155, 40 140 C35 120, 40 85, 40 90Z" fill="url(#skinGrad)"/><path d="M35 80 C35 45, 65 18, 100 18 C135 18, 165 45, 165 80 C165 75, 168 65, 160 55 C155 48, 145 38, 100 35 C55 38, 45 48, 40 55 C32 65, 35 75, 35 80Z" fill="url(#hairGrad)"/><path d="M35 80 C32 95, 30 110, 32 130 C30 135, 28 130, 28 120 C25 100, 28 85, 35 75Z" fill="url(#hairGrad)"/><path d="M165 80 C168 95, 170 110, 168 130 C170 135, 172 130, 172 120 C175 100, 172 85, 165 75Z" fill="url(#hairGrad)"/><path d="M30 85 C28 100, 26 120, 30 145 C28 155, 25 145, 24 130 C22 110, 25 90, 30 80Z" fill="url(#hairGrad)" opacity="0.7"/><path d="M170 85 C172 100, 174 120, 170 145 C172 155, 175 145, 176 130 C178 110, 175 90, 170 80Z" fill="url(#hairGrad)" opacity="0.7"/><g id="eyesGroup"><ellipse cx="75" cy="110" rx="12" ry="8" fill="#fff"/><ellipse cx="125" cy="110" rx="12" ry="8" fill="#fff"/><ellipse id="pupilL" cx="77" cy="110" rx="5" ry="5" fill="#2d1b4e"/><ellipse id="pupilR" cx="127" cy="110" rx="5" ry="5" fill="#2d1b4e"/><ellipse cx="78" cy="109" rx="2" ry="2" fill="#fff" opacity="0.8"/><ellipse cx="128" cy="109" rx="2" ry="2" fill="#fff" opacity="0.8"/><path d="M60 100 Q75 96, 90 100" stroke="#2d1b4e" stroke-width="1.5" fill="none" opacity="0.6"/><path d="M110 100 Q125 96, 140 100" stroke="#2d1b4e" stroke-width="1.5" fill="none" opacity="0.6"/><rect id="eyelidL" x="63" y="102" width="24" height="16" rx="12" fill="url(#skinGrad)" opacity="0"/><rect id="eyelidR" x="113" y="102" width="24" height="16" rx="12" fill="url(#skinGrad)" opacity="0"/></g><ellipse cx="100" cy="135" rx="4" ry="3" fill="#f4a983" opacity="0.6"/><ellipse cx="72" cy="125" rx="10" ry="7" fill="url(#blushL)"/><ellipse cx="128" cy="125" rx="10" ry="7" fill="url(#blushL)"/><path id="mouth" d="M88 148 Q100 155, 112 148" stroke="url(#lipGrad)" stroke-width="3" fill="none" stroke-linecap="round"/><path id="mouthFill" d="M90 147 Q100 152, 110 147" fill="#e84393" opacity="0.3"/></svg></div><div class="avatar-glow" id="avatarGlow"></div></div></div><div class="sound-wave" id="soundWave"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div><div class="response-area" id="responseArea"><div class="message ai">Hello! I'm your AI assistant. I learn from our conversations and get better over time. Try me!</div></div><div class="input-area"><div class="input-wrapper"><textarea id="userInput" placeholder="Ask me anything..." rows="1"></textarea><button class="mic-btn" id="micBtn">&#127908;</button></div><button class="send-btn" id="sendBtn">&#10148;</button></div><div class="controls"><button class="ctrl-btn" onclick="handleRun()">&#9654; Run</button><button class="ctrl-btn" onclick="handleStop()">&#9209; Stop</button><button class="ctrl-btn" onclick="handleStartup()">&#9889; Startup</button><button class="ctrl-btn danger" onclick="handleShutdown()">&#9211; Shutdown</button><button class="ctrl-btn" id="btnMute" onclick="handleMute()">&#128266; Mute</button><button class="ctrl-btn" onclick="showSettings()">&#9881;&#65039;</button></div><div class="modal-overlay" id="settingsModal"><div class="modal"><h2>&#9881;&#65039; Settings</h2><label>Groq API Key</label><input type="password" id="apiKeyInput" placeholder="Enter your Groq API key"><label>Model</label><select id="modelSelect"><option value="llama-3.3-70b-versatile">Llama 3.3 70B (best)</option><option value="llama-3.1-8b-instant">Llama 3.1 8B (fastest)</option><option value="mixtral-8x7b-32768">Mixtral 8x7B</option><option value="gemma2-9b-it">Gemma 2 9B</option></select><label>Voice</label><select id="voiceSelect"></select><label>Learning Memory</label><select id="memoryToggle"><option value="on">Enabled (remembers context)</option><option value="off">Disabled</option></select><div class="modal-btns"><button class="cancel" onclick="hideSettings()">Cancel</button><button class="save" onclick="saveSettings()">Save</button></div></div></div><script>const state={isRunning:true,isMuted:false,isListening:false,isProcessing:false,apiKey:localStorage.getItem('groq_api_key')||'',model:localStorage.getItem('groq_model')||'llama-3.3-70b-versatile',conversationHistory:[],selectedVoice:localStorage.getItem('selected_voice')||'',learningMemory:JSON.parse(localStorage.getItem('learning_memory')||'[]'),errorPatterns:JSON.parse(localStorage.getItem('error_patterns')||'[]'),retryCount:0,maxRetries:3};const responseArea=document.getElementById('responseArea'),userInput=document.getElementById('userInput'),micBtn=document.getElementById('micBtn'),sendBtn=document.getElementById('sendBtn'),avatarGlow=document.getElementById('avatarGlow'),avatarContainer=document.getElementById('avatarContainer'),soundWave=document.getElementById('soundWave'),statusDot=document.getElementById('statusDot'),statusText=document.getElementById('statusText'),mouthEl=document.getElementById('mouth'),mouthFill=document.getElementById('mouthFill'),eyelidL=document.getElementById('eyelidL'),eyelidR=document.getElementById('eyelidR'),pupilL=document.getElementById('pupilL'),pupilR=document.getElementById('pupilR');/* === NATURAL BLINKING === */let blinkTimer=null;function startBlinking(){function doBlink(){eyelidL.style.transition='opacity 0.08s';eyelidR.style.transition='opacity 0.08s';eyelidL.style.opacity='1';eyelidR.style.opacity='1';setTimeout(()=>{eyelidL.style.opacity='0';eyelidR.style.opacity='0';},120);const next=2000+Math.random()*4000;blinkTimer=setTimeout(doBlink,next);}blinkTimer=setTimeout(doBlink,1000+Math.random()*2000);}startBlinking();/* === SUBTLE BODY/HEAD MOVEMENT === */let moveTimer=null;function startIdleMovement(){function doMove(){const moves=['tilt-left','tilt-right','nod'];const m=moves[Math.floor(Math.random()*moves.length)];if(m==='tilt-left'){avatarContainer.style.animation='breathe 4s ease-in-out infinite, tiltLeft 1.2s ease-in-out';}else if(m==='tilt-right'){avatarContainer.style.animation='breathe 4s ease-in-out infinite, tiltRight 1.2s ease-in-out';}else{avatarContainer.style.animation='breathe 4s ease-in-out infinite, nod 1s ease-in-out';}setTimeout(()=>{avatarContainer.style.animation='breathe 4s ease-in-out infinite';},1300);moveTimer=setTimeout(doMove,5000+Math.random()*8000);}moveTimer=setTimeout(doMove,3000+Math.random()*4000);}startIdleMovement();/* === EYE TRACKING (subtle pupil movement) === */let gazeTimer=null;function startGazeShift(){function doGaze(){const dx=(Math.random()-0.5)*3;const dy=(Math.random()-0.5)*2;pupilL.setAttribute('cx',77+dx);pupilL.setAttribute('cy',110+dy);pupilR.setAttribute('cx',127+dx);pupilR.setAttribute('cy',110+dy);gazeTimer=setTimeout(doGaze,2000+Math.random()*3000);}gazeTimer=setTimeout(doGaze,1500);}startGazeShift();/* === MOUTH SYNC WITH SPEECH === */let mouthAnim=null;let mouthFrames=[{d:'M88 148 Q100 155, 112 148',fill:'M90 147 Q100 152, 110 147',h:0.3},{d:'M88 146 Q100 158, 112 146',fill:'M88 147 Q100 156, 112 147',h:0.5},{d:'M88 145 Q100 162, 112 145',fill:'M86 146 Q100 160, 114 146',h:0.7},{d:'M88 146 Q100 156, 112 146',fill:'M88 147 Q100 154, 112 147',h:0.4}];let mouthIdx=0;function animateMouth(on){if(on){let speed=120;mouthAnim=setInterval(()=>{mouthIdx=(mouthIdx+1)%mouthFrames.length;const f=mouthFrames[mouthIdx];mouthEl.setAttribute('d',f.d);mouthFill.setAttribute('d',f.fill);mouthFill.setAttribute('opacity',f.h);},speed);}else{clearInterval(mouthAnim);mouthEl.setAttribute('d','M88 148 Q100 155, 112 148');mouthFill.setAttribute('d','M90 147 Q100 152, 110 147');mouthFill.setAttribute('opacity','0.3');}}/* === STYLE KEYFRAMES (injected for tiltRight and nod) === */const styleEl=document.createElement('style');styleEl.textContent='@keyframes tiltRight{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(2deg) scale(1.01)}}@keyframes nod{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(3px) scale(1)}}';document.head.appendChild(styleEl);/* === SPEECH === */const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';recognition.onresult=(e)=>{const t=Array.from(e.results).map(r=>r[0].transcript).join('');userInput.value=t;if(e.results[0].isFinal){stopListening();sendMessage(t);}};recognition.onerror=()=>stopListening();recognition.onend=()=>stopListening();}const synth=window.speechSynthesis;function getPreferredVoice(){const voices=synth.getVoices();if(state.selectedVoice){const s=voices.find(v=>v.name===state.selectedVoice);if(s)return s;}return voices.find(v=>v.name.includes('Samantha'))||voices.find(v=>v.name.includes('Karen'))||voices.find(v=>v.name.includes('Moira'))||voices.find(v=>v.name.includes('Google UK English Female'))||voices.find(v=>v.name.includes('Microsoft Zira'))||voices.find(v=>v.lang.startsWith('en')&&v.name.toLowerCase().includes('female'))||voices.find(v=>v.lang.startsWith('en-'))||voices[0];}function populateVoices(){const s=document.getElementById('voiceSelect');const v=synth.getVoices();s.innerHTML='';v.forEach((voice,i)=>{const o=document.createElement('option');o.value=i;o.textContent=voice.name+' ('+voice.lang+')';if(voice.name===state.selectedVoice)o.selected=true;s.appendChild(o);});}synth.onvoiceschanged=populateVoices;setTimeout(populateVoices,500);function speak(text){if(state.isMuted||!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(text);const pv=getPreferredVoice();if(pv)u.voice=pv;u.rate=0.9;u.pitch=1.05;u.volume=1.0;u.onstart=()=>{avatarGlow.classList.add('speaking');soundWave.classList.add('active');animateMouth(true);};u.onend=()=>{avatarGlow.classList.remove('speaking');soundWave.classList.remove('active');animateMouth(false);};u.onpause=()=>{animateMouth(false);};u.onresume=()=>{animateMouth(true);};synth.speak(u);}/* === SELF-LEARNING SYSTEM === */function saveLearning(userMsg,aiResponse,wasError,correction){const entry={timestamp:Date.now(),userMsg:userMsg.slice(0,200),response:aiResponse.slice(0,200),wasError,correction:correction||null};state.learningMemory.push(entry);if(state.learningMemory.length>50)state.learningMemory=state.learningMemory.slice(-50);localStorage.setItem('learning_memory',JSON.stringify(state.learningMemory));}function saveErrorPattern(pattern,solution){state.errorPatterns.push({pattern:pattern.slice(0,100),solution:solution.slice(0,200),count:1});if(state.errorPatterns.length>20)state.errorPatterns=state.errorPatterns.slice(-20);localStorage.setItem('error_patterns',JSON.stringify(state.errorPatterns));}function getLearningContext(){if(state.learningMemory.length===0)return'';const recent=state.learningMemory.slice(-5);let ctx='\n[Learning memory - past interactions to learn from:]\n';recent.forEach(m=>{if(m.wasError){ctx+=`- User asked: "${m.userMsg}" -> Previous bad answer was corrected. Better approach: ${m.correction||'be more careful'}\n`;}});if(state.errorPatterns.length>0){ctx+='[Known mistakes to avoid:]\n';state.errorPatterns.slice(-5).forEach(p=>{ctx+=`- Pattern: "${p.pattern}" -> Fix: "${p.solution}"\n`;});}return ctx;}function detectError(userMsg,lastAiResponse){const errorPhrases=['wrong','incorrect','no that\'s not','you\'re wrong','that\'s not right','try again','not what i asked','you made a mistake','that\'s incorrect','nope','no no'];const lower=userMsg.toLowerCase();return errorPhrases.some(p=>lower.includes(p));}/* === MAIN MESSAGING === */micBtn.addEventListener('click',()=>{if(!recognition){addMessage('Speech recognition not supported.','system');return;}if(state.isListening)stopListening();else startListening();});function startListening(){if(!state.isRunning)return;state.isListening=true;micBtn.classList.add('listening');micBtn.innerHTML='&#9210;';recognition.start();}function stopListening(){state.isListening=false;micBtn.classList.remove('listening');micBtn.innerHTML='&#127908;';try{recognition.stop();}catch(e){}}sendBtn.addEventListener('click',()=>{const t=userInput.value.trim();if(t)sendMessage(t);});userInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=userInput.value.trim();if(t)sendMessage(t);}});userInput.addEventListener('input',()=>{userInput.style.height='auto';userInput.style.height=Math.min(userInput.scrollHeight,100)+'px';});async function sendMessage(text){if(!state.isRunning){addMessage('Offline. Tap Startup.','system');return;}addMessage(text,'user');userInput.value='';userInput.style.height='auto';if(!state.apiKey){addMessage('Set your Groq API key in \u2699\ufe0f Settings. Free at console.groq.com','system');return;}state.isProcessing=true;const isCorrection=detectError(text,getLastAiMessage());if(isCorrection&&state.conversationHistory.length>=2){const lastAi=state.conversationHistory[state.conversationHistory.length-1];if(lastAi&&lastAi.role==='assistant'){saveLearning(state.conversationHistory[state.conversationHistory.length-2]?.content||'',lastAi.content,true,text);saveErrorPattern(state.conversationHistory[state.conversationHistory.length-2]?.content||'',text);addMessage('\u2728 Learning from that mistake...','learning');}}state.conversationHistory.push({role:'user',content:text});state.retryCount=0;await attemptResponse();}async function attemptResponse(){try{const response=await callGroq();state.isProcessing=false;addMessage(response,'ai');speak(response);state.conversationHistory.push({role:'assistant',content:response});saveLearning(state.conversationHistory[state.conversationHistory.length-2]?.content||'',response,false);}catch(err){if(state.retryCount<state.maxRetries){state.retryCount++;addMessage(`\u26a0\ufe0f Retrying (attempt ${state.retryCount}/${state.maxRetries})...`,'learning');const lastMsg=state.conversationHistory[state.conversationHistory.length-1];if(lastMsg){lastMsg.content+=' [Please try a different approach]';}await new Promise(r=>setTimeout(r,1000*state.retryCount));await attemptResponse();}else{state.isProcessing=false;addMessage('Error after '+state.maxRetries+' attempts: '+err.message,'system');saveErrorPattern(state.conversationHistory[state.conversationHistory.length-1]?.content||'','API error: '+err.message);}}}function getLastAiMessage(){for(let i=state.conversationHistory.length-1;i>=0;i--){if(state.conversationHistory[i].role==='assistant')return state.conversationHistory[i].content;}return'';}async function callGroq(){const learningCtx=getLearningContext();const sysPrompt='You are a warm, friendly AI assistant with a feminine personality. Give SHORT helpful answers (1-3 sentences) unless asked for detail. Be natural and conversational. If you made a mistake before, acknowledge it gracefully and correct yourself.'+learningCtx;const messages=[{role:'system',content:sysPrompt},...state.conversationHistory.slice(-20)];const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey},body:JSON.stringify({model:state.model,messages,temperature:0.7,max_tokens:1024})});if(!res.ok){const err=await res.json();throw new Error(err.error?.message||'API failed');}const data=await res.json();return data.choices?.[0]?.message?.content||'No response.';}function addMessage(text,type){const div=document.createElement('div');div.className='message '+type;div.textContent=text;responseArea.appendChild(div);responseArea.scrollTop=responseArea.scrollHeight;}function handleRun(){if(!state.isRunning){handleStartup();return;}addMessage('Ready!','system');}function handleStop(){if(state.isProcessing){state.isProcessing=false;avatarGlow.classList.remove('speaking');soundWave.classList.remove('active');animateMouth(false);synth.cancel();addMessage('Stopped.','system');}}function handleStartup(){state.isRunning=true;statusDot.className='status-dot';statusText.textContent='Online';addMessage('Hello! How can I help you?','ai');speak('Hello! How can I help you?');}function handleShutdown(){state.isRunning=false;synth.cancel();avatarGlow.classList.remove('speaking');soundWave.classList.remove('active');animateMouth(false);statusDot.className='status-dot offline';statusText.textContent='Offline';addMessage('Goodbye!','system');}function handleMute(){state.isMuted=!state.isMuted;const btn=document.getElementById('btnMute');btn.innerHTML=state.isMuted?'&#128263; Unmute':'&#128266; Mute';btn.classList.toggle('active',state.isMuted);statusDot.className=state.isMuted?'status-dot muted':'status-dot';if(state.isMuted){synth.cancel();avatarGlow.classList.remove('speaking');soundWave.classList.remove('active');animateMouth(false);statusText.textContent='Muted';}else statusText.textContent='Online';}function showSettings(){document.getElementById('apiKeyInput').value=state.apiKey;document.getElementById('modelSelect').value=state.model;populateVoices();document.getElementById('settingsModal').classList.add('show');}function hideSettings(){document.getElementById('settingsModal').classList.remove('show');}function saveSettings(){state.apiKey=document.getElementById('apiKeyInput').value.trim();state.model=document.getElementById('modelSelect').value;localStorage.setItem('groq_api_key',state.apiKey);localStorage.setItem('groq_model',state.model);const vs=document.getElementById('voiceSelect');const voices=synth.getVoices();if(vs.value&&voices[vs.value]){state.selectedVoice=voices[vs.value].name;localStorage.setItem('selected_voice',state.selectedVoice);}hideSettings();addMessage('Settings saved! Using '+state.model,'system');}if(!state.apiKey){setTimeout(()=>{addMessage('Tap \u2699\ufe0f to add your free Groq API key from console.groq.com','system');},1500);}</script></body></html>
